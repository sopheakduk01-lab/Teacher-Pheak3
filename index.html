    <script>
      (function() {
        // AI Studio environment: HMR WebSocket is disabled over reverse-proxy, ignore WebSocket errors.
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = String((reason && (reason.message || reason)) || '');
          var stack = String((reason && reason.stack) || '');
          if (
            msg.includes('WebSocket') ||
            msg.includes('ws:') ||
            msg.includes('wss:') ||
            stack.includes('@vite/client') ||
            stack.includes('WebSocket')
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          var msg = String(e.message || '');
          var file = String(e.filename || '');
          if (
            msg.includes('WebSocket') ||
            file.includes('@vite/client')
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <script>
      (function() {
        // High-Quality Cheerful Khmer Speech Synthesis Engine
        var isKhmerText = function(str) {
          return /[\u1780-\u17FF]/.test(str || '');
        };

        var hasNativeKhmerVoice = function() {
          try {
            if (!window.speechSynthesis || !window.speechSynthesis.getVoices) return false;
            var voices = window.speechSynthesis.getVoices() || [];
            return voices.some(function(v) {
              return (v.lang && (v.lang.toLowerCase().startsWith('km') || v.lang.toLowerCase().startsWith('kh'))) ||
                     (v.name && v.name.toLowerCase().includes('khmer'));
            });
          } catch(e) {
            return false;
          }
        };

        var currentAudio = null;
        var cancelPlayback = false;

        var splitKhmerChunks = function(text, maxLen) {
          if (!text) return [];
          maxLen = maxLen || 120;
          text = text.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
          var segments = text.split(/([។\n!?]+)/);
          var sentences = [];
          for (var i = 0; i < segments.length; i += 2) {
            var s = (segments[i] || '') + (segments[i + 1] || '');
            s = s.trim();
            if (s) sentences.push(s);
          }
          if (sentences.length === 0 && text.trim()) {
            sentences = [text.trim()];
          }
          var chunks = [];
          for (var j = 0; j < sentences.length; j++) {
            var sent = sentences[j];
            if (sent.length <= maxLen) {
              chunks.push(sent);
            } else {
              var words = sent.split(/\s+/);
              var cur = "";
              for (var k = 0; k < words.length; k++) {
                var w = words[k];
                if ((cur + " " + w).length <= maxLen) {
                  cur = cur ? (cur + " " + w) : w;
                } else {
                  if (cur) chunks.push(cur);
                  if (w.length > maxLen) {
                    for (var m = 0; m < w.length; m += maxLen) {
                      chunks.push(w.slice(m, m + maxLen));
                    }
                    cur = "";
                  } else {
                    cur = w;
                  }
                }
              }
              if (cur) chunks.push(cur);
            }
          }
          return chunks;
        };

        window.stopKhmerAudio = function() {
          cancelPlayback = true;
          if (currentAudio) {
            try {
              currentAudio.pause();
              currentAudio.currentTime = 0;
            } catch(e) {}
            currentAudio = null;
          }
        };

        window.playKhmerSpeech = function(text, onStart, onEnd, onError) {
          window.stopKhmerAudio();
          cancelPlayback = false;
          if (!text || !text.trim()) {
            if (onEnd) onEnd();
            return;
          }

          var chunks = splitKhmerChunks(text, 120);
          if (!chunks.length) {
            if (onEnd) onEnd();
            return;
          }

          if (onStart) onStart();

          var index = 0;
          function playNext() {
            if (cancelPlayback) {
              if (onEnd) onEnd();
              return;
            }
            if (index >= chunks.length) {
              currentAudio = null;
              if (onEnd) onEnd();
              return;
            }
            var chunk = chunks[index++];
            var primaryUrl = "/api/tts?text=" + encodeURIComponent(chunk);
            var fallbackUrl = "https://translate.google.com/translate_tts?ie=UTF-8&tl=km&client=tw-ob&q=" + encodeURIComponent(chunk);

            var audio = new Audio();
            currentAudio = audio;

            var handled = false;
            var nextStep = function() {
              if (handled) return;
              handled = true;
              if (currentAudio === audio) currentAudio = null;
              playNext();
            };

            audio.onended = nextStep;
            audio.onerror = function() {
              if (cancelPlayback) {
                nextStep();
                return;
              }
              var fbAudio = new Audio(fallbackUrl);
              currentAudio = fbAudio;
              fbAudio.onended = nextStep;
              fbAudio.onerror = nextStep;
              fbAudio.play().catch(nextStep);
            };

            audio.src = primaryUrl;
            audio.play().catch(function(err) {
              console.warn("Direct play rejected, trying fallback:", err);
              if (cancelPlayback) {
                nextStep();
                return;
              }
              var fbAudio = new Audio(fallbackUrl);
              currentAudio = fbAudio;
              fbAudio.onended = nextStep;
              fbAudio.onerror = function() {
                if (onError) onError(err);
                nextStep();
              };
              fbAudio.play().catch(nextStep);
            });
          }

          playNext();
        };

        // Polyfill window.speechSynthesis for Khmer
        if (typeof window !== "undefined" && window.speechSynthesis) {
          var origSpeak = window.speechSynthesis.speak.bind(window.speechSynthesis);
          var origCancel = window.speechSynthesis.cancel.bind(window.speechSynthesis);

          window.speechSynthesis.cancel = function() {
            window.stopKhmerAudio();
            return origCancel();
          };

          window.speechSynthesis.speak = function(utter) {
            if (!utter) return;
            var textStr = utter.text || '';
            var isKhmer = isKhmerText(textStr) || (utter.lang && utter.lang.toLowerCase().startsWith('km'));
            if (isKhmer && !hasNativeKhmerVoice()) {
              window.stopKhmerAudio();
              window.playKhmerSpeech(
                textStr,
                function() {
                  if (typeof utter.onstart === 'function') utter.onstart();
                },
                function() {
                  if (typeof utter.onend === 'function') utter.onend();
                },
                function(err) {
                  if (typeof utter.onerror === 'function') utter.onerror(err);
                }
              );
              return;
            }
            return origSpeak(utter);
          };
        }
      })();
    </script>
