<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>មជ្ឈមណ្ឌលគ្រប់គ្រងសិស្សរៀនគួរថ្នាក់ទី៥ និងមុខវិជ្ជាបំប៉នពិសេស</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700;800&family=Moul&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden !important;
      overscroll-behavior-x: none;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Kantumruy Pro', 'Battambang', 'Plus Jakarta Sans', sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .font-moul {
      font-family: 'Moul', serif;
      font-weight: 400;
      line-height: 1.55;
    }
    button, input, select, textarea {
      font-family: inherit;
    }
    .app-wrapper {
      min-height: 100vh;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    /* Sticky Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
    }
    .brand-title {
      font-size: 15px;
      color: #1e3a8a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 12px;
      color: #475569;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: #1d4ed8;
      color: #ffffff;
      border-color: #1e40af;
    }
    .btn-primary:hover {
      background: #1e40af;
    }
    .btn-emerald {
      background: #059669;
      color: #ffffff;
      border-color: #047857;
    }
    .btn-emerald:hover {
      background: #047857;
    }
    .btn-amber {
      background: #d97706;
      color: #ffffff;
      border-color: #b45309;
    }
    .btn-amber:hover {
      background: #b45309;
    }
    .btn-purple {
      background: #6d28d9;
      color: #ffffff;
      border-color: #5b21b6;
    }
    .btn-purple:hover {
      background: #5b21b6;
    }
    .btn-outline {
      background: #ffffff;
      color: #1e293b;
      border-color: #cbd5e1;
    }
    .btn-outline:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .btn-danger {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fecaca;
    }
    .btn-danger:hover {
      background: #fee2e2;
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    /* Main Container */
    .main-container {
      width: 100%;
      max-width: 1260px;
      margin: 0 auto;
      padding: 16px 14px 80px;
      flex: 1;
    }

    /* Auth Gate */
    .auth-container {
      max-width: 900px;
      margin: 12px auto;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.06);
    }
    .auth-banner {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 60%, #2563eb 100%);
      color: #ffffff;
      padding: 24px 20px;
      text-align: center;
    }
    .auth-role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px 18px 0;
      background: #f8fafc;
      border-bottom: 1.5px solid #e2e8f0;
    }
    .auth-role-tab {
      padding: 13px 12px;
      border-radius: 14px 14px 0 0;
      border: 2px solid transparent;
      border-bottom: none;
      background: transparent;
      color: #475569;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .auth-role-tab.active {
      background: #ffffff;
      color: #1d4ed8;
      border-color: #e2e8f0;
    }
    .auth-body {
      padding: 22px 20px;
    }

    /* PIN Keypad */
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 280px;
      margin: 12px auto 0;
    }
    .pin-key {
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      cursor: pointer;
      transition: all 0.12s;
    }
    .pin-key:hover {
      background: #eff6ff;
      border-color: #60a5fa;
      color: #1d4ed8;
    }
    .pin-key:active {
      transform: scale(0.95);
    }

    /* Sub Navigation Tabs */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
      gap: 8px;
      margin-bottom: 18px;
      background: #f8fafc;
      padding: 8px;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
    }
    .nav-tab {
      padding: 10px 10px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      background: transparent;
      color: #475569;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      transition: all 0.15s;
    }
    .nav-tab:hover {
      background: #ffffff;
      color: #0f172a;
    }
    .nav-tab.active {
      background: #1d4ed8;
      color: #ffffff;
      border-color: #1e40af;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.22);
    }

    /* Cards & Stats */
    .card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.02);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .stat-label {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
    }
    .stat-value {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.25;
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Form Controls */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-label {
      font-size: 12.5px;
      font-weight: 700;
      color: #334155;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      background: #ffffff;
    }
    table.data-table th {
      background: #f8fafc;
      color: #1e293b;
      font-weight: 800;
      font-size: 12px;
      padding: 11px 10px;
      text-align: left;
      border-bottom: 1.5px solid #e2e8f0;
    }
    table.data-table td {
      padding: 10px 10px;
      font-size: 13px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    table.data-table tr:hover td {
      background: #f8fafc;
    }

    /* Tags */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .tag-blue { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .tag-green { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .tag-amber { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .tag-red { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .tag-purple { background: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe; }

    /* Subject Filter Grid */
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .subject-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.16s;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .subject-card:hover {
      border-color: #93c5fd;
      transform: translateY(-1px);
    }
    .subject-card.active {
      border-color: #1d4ed8;
      background: #eff6ff;
      box-shadow: 0 6px 14px rgba(29, 78, 216, 0.1);
    }

    /* Lesson Box */
    .lesson-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .formula-box {
      background: #f8fafc;
      border-left: 4px solid #2563eb;
      padding: 11px 14px;
      border-radius: 8px;
      margin: 8px 0;
      font-weight: 600;
      color: #1e293b;
      font-size: 13.5px;
    }
    .example-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      padding: 11px 14px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 13.5px;
    }

    /* QCM Option */
    .qcm-option {
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      background: #ffffff;
      color: #0f172a;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s;
    }
    .qcm-option:hover:not(:disabled) {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .qcm-option.correct {
      border-color: #10b981;
      background: #ecfdf5;
      color: #065f46;
    }
    .qcm-option.wrong {
      border-color: #ef4444;
      background: #fef2f2;
      color: #991b1b;
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      display: none;
      align-items: center;
      gap: 8px;
    }

    /* Print Modal */
    .print-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .print-modal {
      background: #ffffff;
      border-radius: 18px;
      max-width: 740px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    @media (max-width: 640px) {
      .top-header { padding: 10px 12px; }
      .brand-title { font-size: 13.5px; }
      .nav-tabs { grid-template-columns: repeat(2, 1fr); }
      .auth-role-tabs { grid-template-columns: 1fr; }
    }

    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; }
      .card, .table-wrap { border: 1px solid #000 !important; box-shadow: none !important; }
    }
  </style>
</head>

      </div>
      <div class="header-actions">

        <button type="button" class="btn btn-outline btn-sm" id="btnSwitchAccount" style="display:none;" onclick="logoutSession()">

    <!-- Main Content -->
    <main class="main-container" id="appMain"></main>
  </div>

  <!-- Printable Modal -->
  <div class="print-modal-backdrop no-print" id="printModalBackdrop">
    <div class="print-modal">

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;border-top:1px solid #e2e8f0;padding-top:14px;">
        <button type="button" class="btn btn-outline" onclick="closePrintModal()">បិទ</button>
        <button type="button" class="btn btn-primary" onclick="printModalArea()"><i class="fa-solid fa-print"></i> បោះពុម្ព (Print)</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-msg no-print" id="toastBox">

    <span id="toastText">រក្សាទុកដោយជោគជ័យ!</span>
  </div>

    function showToast(text) {
      const box = document.getElementById('toastBox');
      const span = document.getElementById('toastText');
      if (!box || !span) return;
      span.textContent = text;
      box.style.display = 'flex';
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        box.style.display = 'none';
      }, 2800);
    }

          window.parent.playKhmerSpeech(text);

        }
        if (window.speechSynthesis) {

          const u = new SpeechSynthesisUtterance(text);

    }

    // Score & Rank helpers (6 Special Subjects = 600 max)
    function normalizeScores(stu) {
      if (!stu.scores) stu.scores = {};
      return {
        math: Number(stu.scores.math ?? 85),
        khmer: Number(stu.scores.khmer ?? 85),
        composition: Number(stu.scores.composition ?? 85),
        science: Number(stu.scores.science ?? 85),
        social: Number(stu.scores.social ?? 85),
        english: Number(stu.scores.english ?? 85)
      };
    }

    function getStudentTotal(stu) {
      const s = normalizeScores(stu);
      return s.math + s.khmer + s.composition + s.science + s.social + s.english;
    }

    function getStudentAverage(stu) {
      return (getStudentTotal(stu) / 6).toFixed(1);
    }

    function getLetterGrade(avg) {
      const n = parseFloat(avg);
      if (n >= 90) return { grade: 'A', label: 'ល្អប្រសើរ', cls: 'tag-green' };
      if (n >= 80) return { grade: 'B', label: 'ល្អណាស់', cls: 'tag-blue' };
      if (n >= 70) return { grade: 'C', label: 'ល្អ', cls: 'tag-purple' };
      if (n >= 60) return { grade: 'D', label: 'ល្អបង្គួរ', cls: 'tag-amber' };
      if (n >= 50) return { grade: 'E', label: 'មធ្យម', cls: 'tag-amber' };
      return { grade: 'F', label: 'ត្រូវខិតខំបន្ថែម', cls: 'tag-red' };
    }

    function getRankedStudents() {
      const copy = [...state.students];
      copy.sort((a, b) => getStudentTotal(b) - getStudentTotal(a));
      return copy.map((stu, idx) => ({ ...stu, rank: idx + 1 }));
    }

    function getStudentAttendanceStats(stuId) {
      let present = 0, permission = 0, absent = 0;
      Object.values(state.attendance || {}).forEach(dayMap => {
        const st = dayMap[stuId] || 'វត្តមាន';
        if (st === 'វត្តមាន') present++;
        else if (st === 'ច្បាប់') permission++;
        else absent++;
      });
      return { present, permission, absent };
    }

    function appendPinDigit(inputId, digit) {
      const el = document.getElementById(inputId);
      if (!el) return;
      el.value = String(el.value || '') + String(digit);
    }

    function clearPinInput(inputId) {
      const el = document.getElementById(inputId);
      if (el) el.value = '';
    }

    function switchAuthTab(tab) {
      session.authTab = tab;
      render();
    }

    function onSelectStudentLogin(stuId) {
      const stu = state.students.find(s => s.id === stuId);
      const pinInput = document.getElementById('studentLoginPin');
      if (stu && pinInput) pinInput.value = stu.pin;
    }

    function loginAsStudent() {
      const sel = document.getElementById('studentLoginSelect');
      const pin = document.getElementById('studentLoginPin');
      if (!sel || !pin) return;
      const stu = state.students.find(s => s.id === sel.value);
      if (!stu) {
        showToast('រកមិនឃើញឈ្មោះសិស្សក្នុងបញ្ជីរៀនគួរថ្នាក់ទី៥ទេ!');
        return;
      }
      if (String(pin.value).trim() !== String(stu.pin).trim()) {
        showToast('លេខកូដសម្ងាត់សិស្ស (PIN) មិនត្រឹមត្រូវទេ!');
        return;
      }
      session.role = 'student';
      session.studentId = stu.id;
      showToast('ស្វាគមន៍ប្អូន ' + stu.name + ' មកកាន់ថ្នាក់បំប៉នពិសេសទី៥!');
      render();
    }

    function quickStudentLogin(stuId) {
      const stu = state.students.find(s => s.id === stuId);
      if (!stu) return;
      session.role = 'student';
      session.studentId = stu.id;
      showToast('ស្វាគមន៍ប្អូន ' + stu.name + ' មកកាន់ថ្នាក់បំប៉នពិសេសទី៥!');
      render();
    }

    function loginAsTeacher() {
      const pinInput = document.getElementById('teacherLoginPin');
      const val = pinInput ? String(pinInput.value).trim() : '';
      if (val !== String(state.teacherPin).trim()) {
        showToast('លេខកូដសម្ងាត់គ្រូមិនត្រឹមត្រូវទេ! (លេខកូដដើម៖ ' + state.teacherPin + ')');
        return;

      session.role = 'teacher';
      session.teacherUnlocked = true;
      showToast('បានចូលផ្ទាំងគ្រប់គ្រងគ្រូបង្រៀនថ្នាក់ទី៥ដោយជោគជ័យ!');
      render();
    }

        if (s.feeStatus === 'បង់ខ្លះ') return acc + Math.round(net / 2);
        return acc;

      const dayAtt = state.attendance[session.attendanceDate] || {};

          <div class="stat-box">
            <div class="stat-icon" style="background:#f5f3ff;color:#6d28d9;"><i class="fa-solid fa-award"></i></div>

              <div class="stat-value">៦ មុខវិជ្ជា • ${state.homework.length} កិច្ចការផ្ទះ</div>
            </div>
          </div>

          </button>

    function setTeacherTab(t) {
      session.teacherTab = t;

    // Teacher Module 1: Executive Dashboard
    function renderTeacherDashboard() {
      const ranked = getRankedStudents();
      const top3 = ranked.slice(0, 3);
      const count = Math.max(1, state.students.length);

      const subjAvg = {
        math: Math.round(state.students.reduce((a, s) => a + normalizeScores(s).math, 0) / count),
        khmer: Math.round(state.students.reduce((a, s) => a + normalizeScores(s).khmer, 0) / count),
        composition: Math.round(state.students.reduce((a, s) => a + normalizeScores(s).composition, 0) / count),
        science: Math.round(state.students.reduce((a, s) => a + normalizeScores(s).science, 0) / count),
        social: Math.round(state.students.reduce((a, s) => a + normalizeScores(s).social, 0) / count),
        english: Math.round(state.students.reduce((a, s) => a + normalizeScores(s).english, 0) / count)
      };

      const unpaidList = state.students.filter(s => s.feeStatus !== 'បង់រួច');

      return `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;">

    function saveStudentRoster() {
      const name = document.getElementById('stuName').value.trim();
      const gender = document.getElementById('stuGender').value;
      const pin = document.getElementById('stuPin').value.trim() || '1234';
      const shift = document.getElementById('stuShift').value;
      const parentPhone = document.getElementById('stuPhone').value.trim();
      const monthlyFee = Number(document.getElementById('stuFee').value || 40000);

      if (!name) {
        showToast('សូមបញ្ចូលគោត្តនាម និងនាមសិស្សរៀនគួរ!');
        return;
      }

      if (session.editingStudentId) {
        const stu = state.students.find(s => s.id === session.editingStudentId);
        if (stu) {
          stu.name = name;
          stu.gender = gender;
          stu.pin = pin;
          stu.shift = shift;
          stu.parentPhone = parentPhone;
          stu.monthlyFee = monthlyFee;
        }
        session.editingStudentId = null;
        saveData('បានកែប្រែព័ត៌មានសិស្សរៀនគួរដោយជោគជ័យ!');
      } else {
        const nextNum = state.students.length + 1;
        const newId = 'G5-' + String(nextNum).padStart(3, '0');
        state.students.push({
          id: newId,
          name,
          gender,
          pin,
          shift,
          parentPhone,
          monthlyFee,
          discount: 0,
          feeStatus: 'មិនទាន់បង់',
          feePaidDate: '',
          xp: 100,
          scores: { math: 85, khmer: 85, composition: 85, science: 85, social: 85, english: 85 },
          completedHomeworkIds: [],
          homeworkSubmissions: {}
        });
        saveData('បានបន្ថែមសិស្សរៀនគួរថ្នាក់ទី៥ថ្មី (' + name + ')!');
      }
      render();
    }

    function editStudent(id) { session.editingStudentId = id; render(); }
    function cancelEditStudent() { session.editingStudentId = null; render(); }
    function deleteStudent(id) {
      if (state.students.length <= 1) {
        showToast('ត្រូវមានសិស្សយ៉ាងតិច ១ នាក់ក្នុងបញ្ជី!');
        return;
      }
      state.students = state.students.filter(s => s.id !== id);
      saveData('បានលុបឈ្មោះសិស្សចេញពីបញ្ជីរៀនគួរ!');
      render();
    }

    function setStudentAttendance(stuId, status) {
      const d = session.attendanceDate;
      if (!state.attendance[d]) state.attendance[d] = {};
      state.attendance[d][stuId] = status;
      saveData('បានកត់ត្រាវត្តមានសិស្ស (' + status + ')!');
      render();
    }

    function markAllAttendance(status) {
      const d = session.attendanceDate;
      if (!state.attendance[d]) state.attendance[d] = {};
      state.students.forEach(s => { state.attendance[d][s.id] = status; });
      saveData('បានដាក់វត្តមានសិស្សរៀនគួរទាំងអស់!');
      render();
    }

    function buildNoticeText(stu, type) {
      if (!stu) return '';
      const ranked = getRankedStudents();
      const r = ranked.find(x => x.id === stu.id) || stu;
      const avg = getStudentAverage(stu);
      const g = getLetterGrade(avg);
      const net = Math.max(0, Number(stu.monthlyFee || 40000) - Number(stu.discount || 0));
      if (type === 'fee') {
        return `សូមគោរពជូនអាណាព្យាបាលសិស្សឈ្មោះ ${stu.name} (អត្តលេខ ${stu.id} - ${stu.shift})៖ សូមជម្រាបជូនអំពីថ្លៃរៀនគួរថ្នាក់ទី៥ សម្រាប់ខែ ${state.selectedMonth} ចំនួន ${net.toLocaleString()} រៀល (ស្ថានភាពបច្ចុប្បន្ន៖ ${stu.feeStatus})។ សូមអរគុណចំពោះកិច្ចសហការ! ពីគ្រូបន្ទុកថ្នាក់៖ ${state.teacherName}`;
      }
      if (type === 'attendance') {
        const att = getStudentAttendanceStats(stu.id);
        return `សូមគោរពជូនអាណាព្យាបាលសិស្សឈ្មោះ ${stu.name}៖ របាយការណ៍វត្តមានរៀនគួរថ្នាក់ទី៥របស់ប្អូន (មករៀន៖ ${att.present} ដង, ច្បាប់៖ ${att.permission} ដង, អវត្តមាន៖ ${att.absent} ដង)។ សូមអាណាព្យាបាលជួយជំរុញការធ្វើកិច្ចការផ្ទះបន្ថែម។ សូមអរគុណ!`;
      }
      return `សូមគោរពជូនអាណាព្យាបាលសិស្សឈ្មោះ ${stu.name} (អត្តលេខ ${stu.id})៖ លទ្ធផលប្រឡងមុខវិជ្ជាបំប៉នពិសេសថ្នាក់ទី៥ ប្រចាំខែ ${state.selectedMonth} ប្អូនទទួលបានមធ្យមភាគ ${avg}/100 (និទ្ទេស ${g.grade} - ${g.label}) និងចំណាត់ថ្នាក់លេខ ${r.rank} ក្នុងថ្នាក់រៀនគួរ។ សូមអរគុណ! ពីគ្រូបង្រៀន៖ ${state.teacherName}`;
    }

    function generateParentNoticeText() {
      const stuId = document.getElementById('noticeStudentSel').value;
      const type = document.getElementById('noticeTypeSel').value;
      const stu = state.students.find(s => s.id === stuId);
      const box = document.getElementById('noticeOutputBox');
      if (stu && box) box.value = buildNoticeText(stu, type);

    function copyParentNotice() {
      const box = document.getElementById('noticeOutputBox');
      if (!box) return;
      navigator.clipboard.writeText(box.value).then(() => {
        showToast('បានចម្លងអត្ថបទសារជូនដំណឹងរួចរាល់!');
      }).catch(() => {
        showToast('បានចម្លងអត្ថបទសារ!');
      });
    }

      const tName = document.getElementById('settingTeacherName').value.trim();

      if (tName) state.teacherName = tName;
      if (tPin) state.teacherPin = tPin;

      render();
    }

    function generateNewMentalMath() {
      const types = ['×', '+', '-', '÷'];
      const op = types[Math.floor(Math.random() * types.length)];
      let a = 12, b = 8, ans = 96;
      if (op === '×') {
        a = Math.floor(11 + Math.random() * 19);
        b = Math.floor(4 + Math.random() * 12);
        ans = a * b;
      } else if (op === '+') {
        a = Math.floor(45 + Math.random() * 150);
        b = Math.floor(25 + Math.random() * 120);
        ans = a + b;
      } else if (op === '-') {
        a = Math.floor(80 + Math.random() * 150);
        b = Math.floor(15 + Math.random() * 65);
        ans = a - b;
      } else {
        b = Math.floor(4 + Math.random() * 12);
        ans = Math.floor(6 + Math.random() * 15);
        a = b * ans;
      }
      session.mentalMathProblem = { a, b, op, ans };
      session.mentalMathFeedback = '';
      render();
    }

    function gcd(x, y) {
      x = Math.abs(x); y = Math.abs(y);
      while (y) { const t = y; y = x % y; x = t; }
      return x || 1;
    }

    function solveFraction() {
      const a = Number(document.getElementById('frA').value || 0);
      const b = Math.max(1, Number(document.getElementById('frB').value || 1));
      const c = Number(document.getElementById('frC').value || 0);
      const d = Math.max(1, Number(document.getElementById('frD').value || 1));
      const num = a * d + b * c;
      const den = b * d;
      const g = gcd(num, den);
      const sNum = num / g;
      const sDen = den / g;
      document.getElementById('frResult').innerHTML =
        `${a}/${b} + ${c}/${d} = (${a}×${d} + ${b}×${c}) / (${b}×${d}) = ${num}/${den} = <strong>${sNum}/${sDen}</strong>`;
    }

    function solveTriangle() {
      const b = Number(document.getElementById('triBase').value || 0);
      const h = Number(document.getElementById('triHeight').value || 0);
      const s = (b * h) / 2;
      document.getElementById('triResult').innerHTML = `S = (${b} × ${h}) ÷ 2 = <strong>${s} ឯកតាការ៉េ</strong>`;
    }

    function solveSpeed() {
      const v = Number(document.getElementById('spdV').value || 0);
      const t = Number(document.getElementById('spdT').value || 0);
      const d = (v * t).toFixed(2).replace(/\.00$/, '');
      document.getElementById('spdResult').innerHTML = `ចម្ងាយផ្លូវ d = ${v} × ${t} = <strong>${d} km</strong>`;
    }

    function solvePercent() {
      const p = Number(document.getElementById('pctPrice').value || 0);
      const r = Number(document.getElementById('pctRate').value || 0);
      const disc = Math.round((p * r) / 100);
      const finalPrice = p - disc;
      document.getElementById('pctResult').innerHTML = `បញ្ចុះតម្លៃ = ${disc.toLocaleString()}៛ • ត្រូវបង់ = <strong>${finalPrice.toLocaleString()}៛</strong>`;
    }

                    <span class="tag tag-amber">ថ្ងៃប្រគល់៖ ${hw.dueDate}</span>
                    <span class="tag ${isDone ? 'tag-green' : 'tag-purple'}">+${hw.xpReward || 50} XP</span>
                    <h4 style="font-size:15px;font-weight:800;margin-top:8px;color:#0f172a;">${hw.title}</h4>
                  </div>
                  ${isDone ? `<span class="tag tag-green" style="padding:6px 12px;"><i class="fa-solid fa-circle-check"></i> បានប្រគល់រួចរាល់</span>` : ''}
                </div>
                <div style="margin-top:8px;font-size:13.5px;color:#334155;white-space:pre-line;background:#f8fafc;padding:10px 12px;border-radius:10px;">${hw.description}</div>
                <div style="margin-top:10px;">
                  <textarea id="hwAns_${hw.id}" rows="2" class="form-textarea" placeholder="សរសេរចម្លើយសង្ខេប ឬកំណត់ចំណាំកិច្ចការផ្ទះរបស់ប្អូននៅទីនេះ...">${savedAns}</textarea>
                  <div style="margin-top:8px;display:flex;justify-content:flex-end;">
                    <button type="button" class="btn ${isDone ? 'btn-outline' : 'btn-emerald'} btn-sm" onclick="submitStudentHomework('${hw.id}', ${hw.xpReward || 50})">
                      <i class="fa-solid fa-paper-plane"></i> ${isDone ? 'ធ្វើបច្ចុប្បន្នភាពចម្លើយ' : 'ប្រគល់កិច្ចការផ្ទះ (+' + (hw.xpReward || 50) + ' XP)'}
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function submitStudentHomework(hwId, xpReward) {
      const stu = state.students.find(s => s.id === session.studentId);
      if (!stu) return;
      const ansText = (document.getElementById('hwAns_' + hwId)?.value || '').trim();
      if (!stu.completedHomeworkIds) stu.completedHomeworkIds = [];
      if (!stu.homeworkSubmissions) stu.homeworkSubmissions = {};
      stu.homeworkSubmissions[hwId] = ansText || 'បានធ្វើរួចរាល់ក្នុងសៀវភៅរៀនគួរ។';
      if (!stu.completedHomeworkIds.includes(hwId)) {
        stu.completedHomeworkIds.push(hwId);
        stu.xp = Number(stu.xp || 0) + Number(xpReward || 50);
        saveData('អបអរសាទរ! ប្អូនបានប្រគល់កិច្ចការផ្ទះ និងទទួលបាន +' + xpReward + ' XP!');
      } else {
        saveData('បានរក្សាទុកចម្លើយកិច្ចការផ្ទះ!');
      }
      render();
    }

    // Student Module 7: Report Card, Certificate & Leaderboard
    function renderStudentReportAndHonor(stu) {
      const ranked = getRankedStudents();
      const sc = normalizeScores(stu);
      const total = getStudentTotal(stu);
      const avg = getStudentAverage(stu);
      const g = getLetterGrade(avg);

      return `
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
            <h3 class="font-moul" style="font-size:15px;color:#1e3a8a;">
              <i class="fa-solid fa-award"></i> ព្រឹត្តិបត្រពិន្ទុមុខវិជ្ជាបំប៉នពិសេសទាំង ៦ របស់ប្អូន ${stu.name}
            </h3>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button type="button" class="btn btn-outline btn-sm" onclick="printStudentCard('${stu.id}')">
                <i class="fa-solid fa-id-card"></i> បណ្ណសិស្ស VIP
              </button>
              <button type="button" class="btn btn-primary btn-sm" onclick="printStudentReportCard('${stu.id}')">
                <i class="fa-solid fa-print"></i> ព្រឹត្តិបត្រពិន្ទុ
              </button>
              <button type="button" class="btn btn-amber btn-sm" onclick="printHonorCertificate('${stu.id}')">
                <i class="fa-solid fa-certificate"></i> បណ្ណសរសើរ
              </button>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-box"><div class="stat-icon" style="background:#eff6ff;color:#1d4ed8;"><i class="fa-solid fa-calculator"></i></div><div><div class="stat-label">១. គណិតវិទ្យាពិសេស</div><div class="stat-value">${sc.math} / 100</div></div></div>
            <div class="stat-box"><div class="stat-icon" style="background:#ecfdf5;color:#047857;"><i class="fa-solid fa-book"></i></div><div><div class="stat-label">២. ភាសាខ្មែរ-វេយ្យាករណ៍</div><div class="stat-value">${sc.khmer} / 100</div></div></div>
            <div class="stat-box"><div class="stat-icon" style="background:#fffbeb;color:#b45309;"><i class="fa-solid fa-pen-nib"></i></div><div><div class="stat-label">៣. តែងសេចក្តី-សរសេរតាមអាន</div><div class="stat-value">${sc.composition} / 100</div></div></div>
            <div class="stat-box"><div class="stat-icon" style="background:#f5f3ff;color:#6d28d9;"><i class="fa-solid fa-flask"></i></div><div><div class="stat-label">៤. វិទ្យាសាស្ត្រពិសេស</div><div class="stat-value">${sc.science} / 100</div></div></div>
            <div class="stat-box"><div class="stat-icon" style="background:#e0f2fe;color:#0284c7;"><i class="fa-solid fa-earth-asia"></i></div><div><div class="stat-label">៥. សិក្សាសង្គមពិសេស</div><div class="stat-value">${sc.social} / 100</div></div></div>
            <div class="stat-box"><div class="stat-icon" style="background:#ffe4e6;color:#e11d48;"><i class="fa-solid fa-language"></i></div><div><div class="stat-label">៦. ភាសាអង់គ្លេសថ្នាក់ទី៥</div><div class="stat-value">${sc.english} / 100</div></div></div>
          </div>

          <div style="background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
            <div>
              <strong>ពិន្ទុសរុប៖</strong> ${total} / 600 • <strong>មធ្យមភាគ៖</strong> ${avg} • <strong>និទ្ទេស៖</strong> <span class="tag ${g.cls}">${g.grade} (${g.label})</span>
            </div>
            <div>
              <strong>ស្ថានភាពថ្លៃរៀនគួរ (${state.selectedMonth})៖</strong> <span class="tag ${stu.feeStatus === 'បង់រួច' ? 'tag-green' : 'tag-amber'}">${stu.feeStatus}</span>
            </div>
          </div>
        </div>

        <div class="card">
          <h3 class="font-moul" style="font-size:15px;color:#b45309;margin-bottom:12px;">
            🏆 តារាងកិត្តិយសសិស្សរៀនគួរថ្នាក់ទី៥ឆ្នើមប្រចាំខែ (Grade 5 Tutoring Leaderboard)
          </h3>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ចំណាត់ថ្នាក់</th>
                  <th>ឈ្មោះសិស្សរៀនគួរថ្នាក់ទី៥</th>
                  <th>វេនរៀន</th>
                  <th>ពិន្ទុសរុប (600)</th>
                  <th>មធ្យមភាគ & និទ្ទេស</th>
                  <th>ពិន្ទុ XP</th>
                </tr>
              </thead>
              <tbody>
                ${ranked.map(r => {
                  const rAvg = getStudentAverage(r);
                  const rG = getLetterGrade(rAvg);
                  const isMe = r.id === stu.id;
                  return `
                    <tr style="${isMe ? 'background:#eff6ff;font-weight:800;' : ''}">
                      <td>
                        <span class="tag ${r.rank === 1 ? 'tag-amber' : r.rank <= 3 ? 'tag-green' : 'tag-blue'}">
                          ${r.rank === 1 ? '🥇 លេខ 1' : r.rank === 2 ? '🥈 លេខ 2' : r.rank === 3 ? '🥉 លេខ 3' : 'លេខ ' + r.rank}
                        </span>
                      </td>
                      <td>${r.name} ${isMe ? '<span class="tag tag-blue">គណនីប្អូន</span>' : ''}</td>
                      <td>${r.shift}</td>
                      <td style="font-weight:800;">${getStudentTotal(r)} / 600</td>
                      <td><span class="tag ${rG.cls}">${rAvg} (${rG.grade})</span></td>
                      <td><span class="tag tag-purple">⭐ ${r.xp || 0} XP</span></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Print Modal helpers
    function openPrintModal(html) {
      const backdrop = document.getElementById('printModalBackdrop');
      const content = document.getElementById('printModalContent');
      if (!backdrop || !content) return;
      content.innerHTML = html;
      backdrop.style.display = 'flex';
    }

    function closePrintModal() {
      const backdrop = document.getElementById('printModalBackdrop');
      if (backdrop) backdrop.style.display = 'none';
    }

    function printModalArea() {
      const content = document.getElementById('printModalContent');
      if (!content) return;
      const win = window.open('', '_blank', 'width=780,height=680');
      if (!win) {
        window.print();
        return;
      }
      win.document.write(`
        <!DOCTYPE html>
        <html lang="km">
        <head>
          <meta charset="UTF-8" />
          <title>Print</title>
          <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;600;700&family=Moul&display=swap" rel="stylesheet">
          <style>
            body { font-family: 'Kantumruy Pro', 'Battambang', sans-serif; padding: 24px; color: #0f172a; }
            .font-moul { font-family: 'Moul', serif; font-weight: 400; }
          </style>
        </head>
        <body>${content.innerHTML}</body>
        </html>
      `);
      win.document.close();
      setTimeout(() => { win.focus(); win.print(); }, 350);
    }

    render();
  </script>
</body>
</html>
