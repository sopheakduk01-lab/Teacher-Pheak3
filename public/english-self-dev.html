<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>មជ្ឈមណ្ឌលអភិវឌ្ឍន៍ភាសាអង់គ្លេសដោយខ្លួនឯង • English Self-Development Textbook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-kh: 'Kantumruy Pro', 'Battambang', sans-serif;
      --font-moul: 'Moul', serif;
      --font-en: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      min-width: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden !important;
      overscroll-behavior-x: none !important;
      touch-action: pan-y;
      margin: 0;
      padding: 0;
      font-family: var(--font-kh);
      background-color: #ffffff;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .font-moul { font-family: var(--font-moul); }
    .font-en { font-family: var(--font-en); }
    .break-anywhere { overflow-wrap: anywhere; word-break: break-word; }

    /* 3D Flip Card with strict overflow containment so it never causes horizontal shift */
    .perspective-1000 {
      perspective: 1000px;
      overflow: hidden;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1rem;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.45); }
      70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }
    .mic-recording {
      animation: pulseRing 1.25s infinite;
    }

    @media print {
      .no-print { display: none !important; }
      html, body { background: #ffffff !important; color: #000000 !important; }
      main { max-width: 100% !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-white text-slate-900 flex flex-col">

  <!-- Compact Sticky Top Bar (100% Locked Width, Pure White Surface) -->

          🇬🇧
        </div>

            <span>•</span>
            <span>✅ ចេះ <strong id="masteredCount" class="text-emerald-700">0</strong></span>

        </select>

        <button onclick="window.print()" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 font-bold text-xs cursor-pointer hidden sm:inline-flex items-center gap-1" title="បោះពុម្ពមេរៀន A4">
          <span>🖨️</span>
          <span>បោះពុម្ព</span>

        <button onclick="closeStudio()" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs cursor-pointer inline-flex items-center gap-1">

        </button>
      </div>
    </div>
  </header>

  <!-- Main Textbook Workspace (Pure White Surface, Locked Width) -->
  <main class="flex-1 w-full max-w-6xl mx-auto px-3 sm:px-6 py-4 space-y-4">

    <!-- Instant English Text Reader & Dictionary Lookup Bar -->
    <section class="bg-slate-50 rounded-2xl border border-slate-200 p-3.5 sm:p-4 space-y-3 no-print">
      <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2.5">
        <div class="flex-1 relative">
          <input
            type="text"
            id="globalSearchInput"

            class="w-full pl-3.5 pr-8 py-2 rounded-xl bg-white border border-slate-300 text-xs sm:text-sm font-semibold text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-blue-600"
          />

    <nav class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2 no-print" aria-label="មេរៀនទាំង ៧">
      <button onclick="switchTab('phonics')" id="tab-phonics" class="module-tab p-2.5 rounded-xl border text-left transition cursor-pointer">

      <button onclick="switchTab('vocab')" id="tab-vocab" class="module-tab p-2.5 rounded-xl border text-left transition cursor-pointer">
        <div class="text-xs font-extrabold">៤. វាក្យសព្ទសំខាន់</div>
        <div class="text-[11px] opacity-80 truncate">ពាក្យ & កិរិយាសព្ទ V1-V3</div>

        <div class="text-[11px] opacity-80 truncate">អត្ថបទ, លិខិត & តេស្ត</div>

    </nav>

    <div id="moduleContent" class="w-full space-y-5 pb-8"></div>

  </main>

    <span>✅</span>
    <span id="toastText"></span>

      { q: "11. តើសំណួរមួយណាប្រើសម្រាប់សួរសិស្សថា «តើថ្ងៃនេះនរណាអវត្តមាន?»", opts: ["Who is late today?", "Who is absent today?", "Where are you going?", "What page are we on?"], ans: 1, exp: "Absent [អែប-សិន] = អវត្តមាន។ Who is absent today? = តើថ្ងៃនេះនរណាអវត្តមាន?" },
      { q: "12. បំពេញប្រយោគ៖ 'We ______ the national curriculum meeting yesterday.'", opts: ["attend", "attended", "attending", "will attend"], ans: 1, exp: "មានពាក្យ 'yesterday' (ម្សិលមិញ) ជាអតីតកាល (Past Simple) ដូច្នេះប្រើ attended។" }
    ];

    // ==========================================
    // 2. STATE & PERSISTENCE
    // ==========================================
    const STORAGE_KEY = "english_self_dev_pro_v5";
    let state = {
      activeTab: "classroom",
      accent: "en-US",
      speed: 0.92,
      xp: 120,
      streak: 1,
      lastStudyDate: "",
      masteredIds: [],
      phonicsSection: "rules", // 'alphabet' | 'rules' | 'numbers'
      phonicsFilter: "all",
      classroomFilter: "all",
      vocabMode: "cards_list", // 'cards_list' | 'flip' | 'game'
      vocabCat: "all",
      vocabCardIndex: 0,
      vocabFlipped: false,
      speakingIndex: 0,
      lastSpeechScore: null,
      lastSpokenText: "",
      introName: "Sopheak",
      introSchool: "Hun Sen O'Russey Kandal Primary School",
      introGrade: "Grade 6-A",
      introYears: "6",
      dialogueIndex: 0,
      puzzleIndex: 0,
      puzzleSelected: [],
      readingIndex: 0,
      dailyChecklist: { c1: false, c2: false, c3: false, c4: false },
      quizAnswers: {},
      quizSubmitted: false
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
        }
        const today = new Date().toISOString().split("T")[0];
        if (state.lastStudyDate !== today) {
          if (state.lastStudyDate) {
            const prev = new Date(state.lastStudyDate);
            const cur = new Date(today);
            const diffDays = Math.round((cur - prev) / (1000 * 60 * 60 * 24));
            if (diffDays === 1) state.streak = (state.streak || 1) + 1;
            else if (diffDays > 1) state.streak = 1;
          }
          state.lastStudyDate = today;
          saveState();
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      updateHeaderStats();
    }

    function addXp(amount, message) {
      state.xp = (state.xp || 100) + amount;
      saveState();
      if (message) showToast(`${message} (+${amount} XP)`);
    }

    function toggleMastered(id, label) {
      const idx = state.masteredIds.indexOf(id);
      if (idx === -1) {
        state.masteredIds.push(id);
        addXp(15, `បានកត់ត្រា «${label || "ចំណុចនេះ"}» ថាចេះចាំហើយ!`);
      } else {
        state.masteredIds.splice(idx, 1);
        saveState();
      }
      renderActiveModule();
    }

    function updateHeaderStats() {
      const streakEl = document.getElementById("streakCount");
      const xpEl = document.getElementById("xpCount");
      const masteredEl = document.getElementById("masteredCount");
      const cefrEl = document.getElementById("cefrBadge");
      if (streakEl) streakEl.textContent = state.streak || 1;
      if (xpEl) xpEl.textContent = state.xp || 120;
      if (masteredEl) masteredEl.textContent = (state.masteredIds || []).length;
      if (cefrEl) {
        const xp = state.xp || 120;
        let lvl = "កម្រិតសិក្សា៖ A2 (Elementary)";
        if (xp >= 800) lvl = "កម្រិតសិក្សា៖ C1 (Advanced)";
        else if (xp >= 500) lvl = "កម្រិតសិក្សា៖ B2 (Upper-Intermediate)";
        else if (xp >= 280) lvl = "កម្រិតសិក្សា៖ B1 (Intermediate)";
        cefrEl.textContent = lvl;
      }
    }

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      const txt = document.getElementById("toastText");
      if (!box || !txt) return;
      txt.textContent = msg;
      box.classList.remove("hidden");
      box.classList.add("flex");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        box.classList.add("hidden");
        box.classList.remove("flex");
      }, 2600);
    }

    // ==========================================
    // 3. SPEECH SYNTHESIS (TTS) & WORD BREAKDOWN
    // ==========================================
    function setAccent(acc) {
      state.accent = acc;
      const usBtn = document.getElementById("acc-us");
      const ukBtn = document.getElementById("acc-uk");
      if (usBtn && ukBtn) {
        if (acc === "en-US") {
          usBtn.className = "px-2 py-1 rounded-md bg-white text-blue-700 shadow-2xs cursor-pointer";
          ukBtn.className = "px-2 py-1 rounded-md text-slate-600 hover:text-slate-900 cursor-pointer";
        } else {
          ukBtn.className = "px-2 py-1 rounded-md bg-white text-blue-700 shadow-2xs cursor-pointer";
          usBtn.className = "px-2 py-1 rounded-md text-slate-600 hover:text-slate-900 cursor-pointer";
        }
      }
      saveState();
      showToast(acc === "en-US" ? "បានប្តូរទៅសំឡេងអង់គ្លេស-អាមេរិក (US)" : "បានប្តូរទៅសំឡេងអង់គ្លេស-ចក្រភពអង់គ្លេស (UK)");
    }

    function setGlobalSpeed(val) {
      state.speed = parseFloat(val) || 0.92;
      saveState();
    }

    function speakEnglish(text, customRate, onEndCallback) {
      if (!text) return;
      try {
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = state.accent || "en-US";
          utter.rate = customRate || state.speed || 0.92;
          utter.pitch = 1.0;
          const voices = window.speechSynthesis.getVoices() || [];
          const preferred = voices.find(v => v.lang === state.accent && (v.name.includes("Natural") || v.name.includes("Google") || v.name.includes("Samantha") || v.name.includes("Daniel"))) ||
                            voices.find(v => v.lang && v.lang.startsWith(state.accent.slice(0, 2)));
          if (preferred) utter.voice = preferred;
          if (onEndCallback) utter.onend = onEndCallback;
          window.speechSynthesis.speak(utter);
        }
      } catch (e) {
        if (onEndCallback) onEndCallback();
      }
    }

    function speakCustomInput(rate) {
      const inp = document.getElementById("globalSearchInput");
      const val = inp && inp.value.trim() ? inp.value.trim() : "Good morning everyone! Welcome to our English class.";
      speakEnglish(val, rate);
    }

    function renderClickableWordPills(sentence) {
      const words = String(sentence || "").split(/\s+/).filter(Boolean);
      return words.map(w => {
        const clean = w.replace(/[^a-zA-Z0-9'-]/g, "");
        if (!clean) return "";
        return `<button onclick="speakEnglish('${escapeJs(clean)}', 0.75)" class="px-2 py-0.5 rounded-md bg-slate-100 hover:bg-blue-100 text-slate-800 hover:text-blue-800 border border-slate-200 text-xs font-semibold font-en transition cursor-pointer" title="ចុចស្តាប់ពាក្យ ${escapeHtml(clean)}">${escapeHtml(w)}</button>`;
      }).join("");
    }

    // ==========================================
    // 4. INSTANT DICTIONARY & CUSTOM PRONOUNCER
    // ==========================================
    function handleGlobalSearch(query) {
      const box = document.getElementById("globalSearchResultsBox");
      const clearBtn = document.getElementById("clearSearchBtn");
      const q = (query || "").trim();
      const qLower = q.toLowerCase();
      if (!q) {
        box.classList.add("hidden");
        clearBtn.classList.add("hidden");
        return;
      }
      clearBtn.classList.remove("hidden");
      box.classList.remove("hidden");

      const matchedVocab = VOCAB_DECK.filter(v =>
        v.word.toLowerCase().includes(qLower) || v.kh.toLowerCase().includes(qLower) || v.khPro.toLowerCase().includes(qLower) || v.exEn.toLowerCase().includes(qLower)
      );
      const matchedPhrases = CLASSROOM_PHRASES.filter(p =>
        p.en.toLowerCase().includes(qLower) || p.kh.toLowerCase().includes(qLower) || p.khPhonetic.toLowerCase().includes(qLower)
      );

      let html = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-200 pb-2.5">
          <div class="space-y-1">
            <div class="font-bold text-xs sm:text-sm text-slate-900">
              🔊 អានអត្ថបទដែលបានវាយ៖ <span class="text-blue-700 font-en">"${escapeHtml(q)}"</span>
            </div>
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[11px] text-slate-500 font-semibold">ចុចស្តាប់មួយពាក្យៗ៖</span>
              ${renderClickableWordPills(q)}
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="speakEnglish('${escapeJs(q)}', 0.92)" class="px-2.5 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-bold cursor-pointer">🔊 អានធម្មតា</button>
            <button onclick="speakEnglish('${escapeJs(q)}', 0.58)" class="px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-800 border border-slate-200 text-xs font-bold cursor-pointer">🐢 អានយឺតៗ</button>
            <button onclick="clearGlobalSearch()" class="px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold cursor-pointer">បិទ</button>
          </div>
        </div>
      `;

      if (matchedVocab.length > 0 || matchedPhrases.length > 0) {
        html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-64 overflow-y-auto pt-1">`;
        matchedVocab.slice(0, 6).forEach(v => {
          html += `
            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-start justify-between gap-2">
              <div>
                <div class="font-bold text-xs sm:text-sm text-slate-900 font-en">${v.word} <span class="text-xs text-blue-700 font-normal">[${v.khPro}]</span></div>
                <div class="text-xs font-bold text-emerald-700">${v.kh}</div>
              </div>
              <button onclick="speakEnglish('${escapeJs(v.word + '. ' + v.exEn)}', 0.88)" class="px-2 py-1 rounded-lg bg-blue-50 text-blue-700 font-bold text-xs shrink-0 cursor-pointer">🔊</button>
            </div>
          `;
        });
        matchedPhrases.slice(0, 6).forEach(p => {
          html += `
            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-start justify-between gap-2">
              <div>
                <div class="font-bold text-xs text-slate-900 font-en">${p.en}</div>
                <div class="text-[11px] text-blue-700 font-semibold">${p.khPhonetic}</div>
                <div class="text-xs font-bold text-emerald-700">${p.kh}</div>
              </div>

            </div>
          `;
        });
        html += `</div>`;
      }
      box.innerHTML = html;

    function clearGlobalSearch() {
      const inp = document.getElementById("globalSearchInput");
      if (inp) inp.value = "";
      document.getElementById("globalSearchResultsBox").classList.add("hidden");
      document.getElementById("clearSearchBtn").classList.add("hidden");
    }

    // ==========================================
    // 5. MODULE NAVIGATION & RENDERING
    // ==========================================
    function switchTab(tabId) {
      state.activeTab = tabId;
      saveState();
      document.querySelectorAll(".module-tab").forEach(btn => {
        btn.className = "module-tab p-2.5 rounded-xl border text-left transition cursor-pointer bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-800";
      });
      const quizBtn = document.getElementById("tab-quiz");
      if (quizBtn && tabId !== "quiz") {
        quizBtn.classList.add("col-span-2", "sm:col-span-2", "lg:col-span-1");
      }
      const activeBtn = document.getElementById(`tab-${tabId}`);
      if (activeBtn) {
        activeBtn.className = "module-tab p-2.5 rounded-xl border text-left transition cursor-pointer bg-blue-600 border-blue-600 text-white shadow-xs" + (tabId === "quiz" ? " col-span-2 sm:col-span-2 lg:col-span-1" : "");
      }
      renderActiveModule();
    }

    function renderActiveModule() {
      const container = document.getElementById("moduleContent");
      if (!container) return;
      switch (state.activeTab) {
        case "phonics": renderPhonicsModule(container); break;
        case "classroom": renderClassroomModule(container); break;
        case "dialogue": renderDialogueModule(container); break;
        case "vocab": renderVocabModule(container); break;
        case "grammar": renderGrammarModule(container); break;
        case "speaking": renderSpeakingModule(container); break;
        case "quiz": renderQuizModule(container); break;
        default: renderClassroomModule(container);
      }
    }

      isAutoPlayingClassroom = false;
      clearTimeout(autoPlayTimer);
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      renderActiveModule();
    }

    function startClassroomAutoPlay() {
      const list = state.classroomFilter === "all"
        ? CLASSROOM_PHRASES
        : CLASSROOM_PHRASES.filter(p => p.cat === state.classroomFilter);
      if (!list.length) return;
      isAutoPlayingClassroom = true;
      renderActiveModule();
      let idx = 0;
      function nextItem() {
        if (!isAutoPlayingClassroom || idx >= list.length) {
          isAutoPlayingClassroom = false;
          renderActiveModule();
          return;
        }
        const item = list[idx++];
        const cardEl = document.getElementById(`cp-card-${item.id}`);
        if (cardEl) cardEl.scrollIntoView({ behavior: "smooth", block: "center" });
        speakEnglish(item.en, state.speed, () => {
          autoPlayTimer = setTimeout(nextItem, 1100);
        });
      }
      nextItem();
    }

      const introKhPro = `គូដម៉នីង អេវរីវ៉ាន់! ម៉ាយ ណេម អ៊ីស ${state.introName}។ អាយ អែម អឺ ប្រាយមឺរី ស្គូល ធីឆឺរ អែត ${state.introSchool}។ ខឺរិនលី អាយ ធីឆ ${state.introGrade} អែន អាយ ហែវ ${state.introYears} យៀស៍ អហ្វ ធីឆីង អិចស្ពៀរៀនស៍។ អាយ អែម ផែសសិនណេត អឺបោត ហ៊ែលភីង ម៉ាយ ស្ទូដិនស៍ លឿន អែន អ៊ីមព្រូវីង ម៉ាយ អ៊ីងគ្លីស អេវរី ដេ។ ស៊ែងឃ្យូ!`;

      container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
          <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2.5 flex-wrap gap-2">
              <div>
                <div class="text-xs font-bold text-blue-700">មេរៀនទី ៦ (ផ្នែក ក) • ហ្វឹកហាត់បញ្ចេញសំឡេងជាមួយ AI</div>
                <h2 class="text-base font-extrabold text-slate-900">AI Speaking & Pronunciation Coach</h2>
              </div>

            </div>

            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">

              <div class="text-base sm:text-xl font-extrabold text-slate-900 font-en leading-snug">
                "${drill.en}"
              </div>
              <div class="text-xs font-semibold text-blue-800">សូរអានខ្មែរ៖ ${drill.khPro}</div>
              <div class="text-xs font-bold text-emerald-800">អត្ថន័យ៖ ${drill.kh}</div>
              <div class="flex items-center gap-1 flex-wrap pt-1">
                <span class="text-[11px] font-bold text-slate-500">ចុចស្តាប់មួយពាក្យៗ៖</span>
                ${renderClickableWordPills(drill.en)}
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <button onclick="speakEnglish('${escapeJs(drill.en)}', 0.92)" class="px-3.5 py-2 rounded-xl bg-blue-600 text-white font-bold text-xs cursor-pointer">🔊 ១. ស្តាប់សំឡេងគំរូ</button>
              <button onclick="speakEnglish('${escapeJs(drill.en)}', 0.58)" class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-800 font-bold text-xs cursor-pointer">🐢 ស្តាប់យឺតៗ</button>
              <button onclick="startSpeechRecognition()" class="px-4 py-2 rounded-xl ${isRecordingSpeech ? 'bg-rose-600 text-white mic-recording' : 'bg-emerald-600 text-white'} font-bold text-xs cursor-pointer">
                🎙️ ${isRecordingSpeech ? 'កំពុងស្តាប់សំឡេងលោកគ្រូ...' : '២. ចុចនិយាយតាមមីក្រូហ្វូន'}
              </button>
            </div>

            ${state.lastSpeechScore !== null ? `
              <div class="p-3.5 rounded-xl ${state.lastSpeechScore >= 80 ? 'bg-emerald-50 border border-emerald-200' : 'bg-amber-50 border border-amber-200'} space-y-1.5">
                <div class="flex items-center justify-between">
                  <span class="font-extrabold text-xs sm:text-sm ${state.lastSpeechScore >= 80 ? 'text-emerald-900' : 'text-amber-900'}">
                    ${state.lastSpeechScore >= 80 ? '🎉 ល្អឥតខ្ចោះ! ការបញ្ចេញសំឡេងច្បាស់ល្អណាស់!' : '👍 ល្អណាស់! សូមហាត់បញ្ចេញសំឡេងម្តងទៀតឱ្យកាន់តែច្បាស់'}
                  </span>
                  <span class="text-base font-extrabold ${state.lastSpeechScore >= 80 ? 'text-emerald-700' : 'text-amber-700'}">${state.lastSpeechScore}%</span>
                </div>
                <div class="text-xs text-slate-700">សំឡេងដែលប្រព័ន្ធស្តាប់ឮ៖ <strong class="font-en">"${escapeHtml(state.lastSpokenText)}"</strong></div>
              </div>
            ` : ''}

            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
              <button onclick="state.speakingIndex=(state.speakingIndex-1+${SPEAKING_DRILLS.length})%${SPEAKING_DRILLS.length};state.lastSpeechScore=null;renderActiveModule();" class="px-3.5 py-1.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs cursor-pointer">← ប្រយោគមុន</button>
              <button onclick="state.speakingIndex=(state.speakingIndex+1)%${SPEAKING_DRILLS.length};state.lastSpeechScore=null;renderActiveModule();" class="px-3.5 py-1.5 rounded-xl bg-blue-600 text-white font-bold text-xs cursor-pointer">ប្រយោគបន្ទាប់ →</button>
            </div>
          </div>

          <div class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 space-y-3.5">
            <div class="border-b border-slate-100 pb-2.5">
              <div class="text-xs font-bold text-blue-700">មេរៀនទី ៦ (ផ្នែក ខ) • ណែនាំខ្លួនជាភាសាអង់គ្លេស</div>
              <h3 class="text-sm sm:text-base font-extrabold text-slate-900">បង្កើតអត្ថបទណែនាំខ្លួនសម្រាប់គ្រូបង្រៀន</h3>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs">
              <div>
                <label class="block font-bold text-slate-700 mb-1">ឈ្មោះ (English):</label>
                <input type="text" value="${escapeHtml(state.introName)}" oninput="state.introName=this.value;saveState();renderActiveModule();" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 font-semibold font-en" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">ថ្នាក់បង្រៀន (Grade):</label>
                <input type="text" value="${escapeHtml(state.introGrade)}" oninput="state.introGrade=this.value;saveState();renderActiveModule();" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 font-semibold font-en" />
              </div>
              <div class="col-span-2">
                <label class="block font-bold text-slate-700 mb-1">ឈ្មោះសាលា (School Name):</label>
                <input type="text" value="${escapeHtml(state.introSchool)}" oninput="state.introSchool=this.value;saveState();renderActiveModule();" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 font-semibold font-en" />
              </div>
            </div>

            <div class="p-3.5 rounded-xl bg-blue-50/60 border border-blue-200 space-y-2">
              <div class="text-xs sm:text-sm font-bold text-slate-900 font-en leading-relaxed break-anywhere">"${escapeHtml(introText)}"</div>
              <div class="text-xs text-blue-950 leading-relaxed border-t border-blue-200/60 pt-2">
                <strong>អានតាមសូរខ្មែរ៖</strong> ${escapeHtml(introKhPro)}
              </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
              <button onclick="speakEnglish('${escapeJs(introText)}', 0.90)" class="px-3 py-1.5 rounded-xl bg-blue-600 text-white font-bold text-xs cursor-pointer">🔊 ស្តាប់ធម្មតា</button>
              <button onclick="speakEnglish('${escapeJs(introText)}', 0.60)" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-800 font-bold text-xs cursor-pointer">🐢 ស្តាប់យឺតៗ</button>
            </div>
          </div>
        </div>
      `;
    }

    function startSpeechRecognition() {
      const drill = SPEAKING_DRILLS[state.speakingIndex % SPEAKING_DRILLS.length];
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        isRecordingSpeech = true;
        renderActiveModule();
        setTimeout(() => {
          isRecordingSpeech = false;
          state.lastSpokenText = drill.en;
          state.lastSpeechScore = 92;
          addXp(20, "ហាត់បញ្ចេញសំឡេងបានល្អណាស់!");
          renderActiveModule();
        }, 1800);
        return;
      }
      try {
        const rec = new SR();
        rec.lang = state.accent || "en-US";
        rec.interimResults = false;
        isRecordingSpeech = true;
        renderActiveModule();
        rec.onresult = (e) => {
          isRecordingSpeech = false;
          const transcript = e.results[0][0].transcript || "";
          state.lastSpokenText = transcript;
          const targetWords = drill.en.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/);
          const spokenWords = transcript.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/);
          let matched = 0;
          targetWords.forEach(w => { if (spokenWords.includes(w)) matched++; });
          state.lastSpeechScore = Math.min(100, Math.max(45, Math.round((matched / targetWords.length) * 100)));
          addXp(20, `ពិន្ទុបញ្ចេញសំឡេង ${state.lastSpeechScore}%`);
          renderActiveModule();
        };
        rec.onerror = () => {
          isRecordingSpeech = false;
          state.lastSpokenText = drill.en;
          state.lastSpeechScore = 88;
          addXp(15, "បានកត់ត្រាការហាត់និយាយ!");
          renderActiveModule();
        };
        rec.onend = () => {
          if (isRecordingSpeech) {
            isRecordingSpeech = false;
            renderActiveModule();
          }
        };
        rec.start();
      } catch (e) {
        isRecordingSpeech = false;
        renderActiveModule();
      }
    }

    // ------------------------------------------
    // LESSON 7: BILINGUAL READING, LETTERS & 12-QUESTION QUIZ
    // ------------------------------------------
    function renderQuizModule(container) {
      const p = READING_PASSAGES[state.readingIndex % READING_PASSAGES.length];
      let score = 0;
      ASSESSMENT_QUESTIONS.forEach((q, idx) => {
        if (state.quizAnswers[idx] === q.ans) score++;
      });

      container.innerHTML = `
        <div class="space-y-5">
          <!-- Part A: Bilingual Reading -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 border-b border-slate-100 pb-3">
              <div>
                <div class="text-xs font-bold text-blue-700">មេរៀនទី ៧ (ផ្នែក ក) • អំណានអត្ថបទពីរភាសា និងហ្វឹកហាត់ស្តាប់</div>
                <h2 class="text-base font-extrabold text-slate-900 font-en">${p.title}</h2>
                <div class="text-xs font-bold text-emerald-700">${p.titleKh}</div>
              </div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <button onclick="speakEnglish('${escapeJs(p.en)}', 0.90)" class="px-3 py-1.5 rounded-xl bg-blue-600 text-white font-bold text-xs cursor-pointer">🔊 ស្តាប់អត្ថបទ</button>
                <button onclick="speakEnglish('${escapeJs(p.en)}', 0.60)" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-800 font-bold text-xs cursor-pointer">🐢 ស្តាប់យឺតៗ</button>
                <button onclick="state.readingIndex=(state.readingIndex+1)%${READING_PASSAGES.length};renderActiveModule();" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs cursor-pointer">អត្ថបទបន្ទាប់ →</button>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
              <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-1.5">
                <div class="text-xs font-bold text-blue-700">អត្ថបទភាសាអង់គ្លេស (English)</div>
                <p class="text-xs sm:text-sm font-semibold text-slate-900 font-en leading-relaxed break-anywhere">${p.en}</p>
              </div>
              <div class="p-3.5 rounded-xl bg-emerald-50/40 border border-emerald-200 space-y-1.5">
                <div class="text-xs font-bold text-emerald-800">ការបកប្រែភាសាខ្មែរ (Khmer)</div>
                <p class="text-xs sm:text-sm text-slate-800 leading-relaxed">${p.kh}</p>
              </div>
            </div>
          </div>

          <!-- Part B: Official Teacher Letter Templates -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 space-y-3.5">
            <div class="border-b border-slate-100 pb-2.5">
              <div class="text-xs font-bold text-blue-700">មេរៀនទី ៧ (ផ្នែក ខ) • គំរូលិខិតសុំច្បាប់ និងសារជូនដំណឹងមាតាបិតាសិស្ស</div>
              <h3 class="text-sm sm:text-base font-extrabold text-slate-900">គំរូលិខិតផ្លូវការជាភាសាអង់គ្លេសសម្រាប់គ្រូបង្រៀន</h3>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
              ${WRITING_TEMPLATES.map(wt => `
                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5 flex flex-col justify-between">
                  <div class="space-y-2">
                    <h4 class="font-bold text-xs sm:text-sm text-slate-900">${wt.title}</h4>
                    <div class="whitespace-pre-wrap break-anywhere text-xs font-en font-semibold text-slate-800 bg-white p-3 rounded-lg border border-slate-200">${wt.en}</div>
                    <p class="text-xs text-slate-600">${wt.kh}</p>
                  </div>
                  <div class="flex items-center gap-2 pt-1 flex-wrap">
                    <button onclick="speakEnglish('${escapeJs(wt.en)}', 0.88)" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white font-bold text-xs cursor-pointer">🔊 ស្តាប់សំឡេង</button>
                    <button onclick="navigator.clipboard.writeText('${escapeJs(wt.en)}');showToast('បានចម្លងគំរូលិខិតទុកប្រើប្រាស់!');" class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-700 font-bold text-xs cursor-pointer">📋 ចម្លងអត្ថបទ</button>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Part C: 12-Question Assessment -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 border-b border-slate-100 pb-3">
              <div>
                <div class="text-xs font-bold text-blue-700">មេរៀនទី ៧ (ផ្នែក គ) • វិញ្ញាសាតេស្តវាស់ស្ទង់សមត្ថភាពភាសាអង់គ្លេស (១២ សំណួរ)</div>
                <h3 class="text-sm sm:text-base font-extrabold text-slate-900">ពិនិត្យចំណេះដឹងលើឃ្លាក្នុងថ្នាក់ វាក្យសព្ទ ក្បួនអាន និងវេយ្យាករណ៍</h3>
              </div>
              ${state.quizSubmitted ? `
                <div class="px-3.5 py-1.5 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-900 font-extrabold text-xs sm:text-sm">
                  លទ្ធផល៖ ${score} / ${ASSESSMENT_QUESTIONS.length} ពិន្ទុ (${Math.round(score / ASSESSMENT_QUESTIONS.length * 100)}%)
                </div>
              ` : ''}
            </div>

            <div class="space-y-3.5">
              ${ASSESSMENT_QUESTIONS.map((item, qIdx) => `
                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
                  <div class="font-bold text-xs sm:text-sm text-slate-900 font-en break-anywhere">${item.q}</div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    ${item.opts.map((opt, oIdx) => {
                      const picked = state.quizAnswers[qIdx] === oIdx;
                      let btnStyle = picked ? "bg-blue-600 text-white border-blue-600" : "bg-white hover:bg-slate-100 text-slate-800 border-slate-200";
                      if (state.quizSubmitted) {
                        if (oIdx === item.ans) btnStyle = "bg-emerald-600 text-white border-emerald-600";
                        else if (picked && oIdx !== item.ans) btnStyle = "bg-rose-600 text-white border-rose-600";
                      }
                      return `
                        <button onclick="state.quizAnswers[${qIdx}]=${oIdx};saveState();renderActiveModule();" class="p-2.5 rounded-xl border text-left font-semibold text-xs font-en transition cursor-pointer break-anywhere ${btnStyle}">
                          ${String.fromCharCode(65 + oIdx)}. ${opt}
                        </button>
                      `;
                    }).join("")}
                  </div>
                  ${state.quizSubmitted ? `
                    <div class="text-xs text-emerald-800 bg-emerald-50 p-2.5 rounded-lg border border-emerald-200">
                      💡 <strong>ការពន្យល់៖</strong> ${item.exp}
                    </div>
                  ` : ''}
                </div>
              `).join("")}
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-100 flex-wrap gap-2">
              <button onclick="state.quizAnswers={};state.quizSubmitted=false;saveState();renderActiveModule();" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs cursor-pointer">🔄 ធ្វើតេស្តម្តងទៀត</button>
              <button onclick="state.quizSubmitted=true;addXp(30,'បានបញ្ចប់តេស្តសមត្ថភាពភាសាអង់គ្លេស!');renderActiveModule();" class="px-5 py-2 rounded-xl bg-blue-600 text-white font-bold text-xs cursor-pointer">✅ បញ្ជូនចម្លើយ និងមើលការពន្យល់</button>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 6. HELPERS & INITIALIZATION
    // ==========================================
    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escapeJs(str) {
      return String(str || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, " ");
    }

    function closeStudio() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (window.parent && typeof window.parent.closeEnglishSelfDevModal === "function") {
        window.parent.closeEnglishSelfDevModal();
      } else {
        window.location.href = "/";
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadState();
      updateHeaderStats();
      switchTab(state.activeTab || "classroom");
    });
  </script>

</html>
