<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>មជ្ឈមណ្ឌលអភិវឌ្ឍន៍ខ្លួនឯងលើភាសាអង់គ្លេស • English Mastery Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-kh: 'Kantumruy Pro', 'Battambang', sans-serif;
      --font-moul: 'Moul', serif;
      --font-en: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: var(--font-kh);
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .font-moul { font-family: var(--font-moul); }
    .font-en { font-family: var(--font-en); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 3D Flip Card */
    .perspective-1000 { perspective: 1000px; }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1.25rem;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    @keyframes pulseRing {
      0% { transform: scale(0.97); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.5); }
      70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(225, 29, 72, 0); }
      100% { transform: scale(0.97); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }
    .mic-recording {
      animation: pulseRing 1.3s infinite;
    }

    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; }
      main { max-width: 100% !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col selection:bg-blue-600 selection:text-white">

  <!-- Top Navigation Header (Clean White Surface) -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs px-3 sm:px-6 py-3 no-print">
    <div class="max-w-7xl mx-auto flex flex-col gap-3">
      <!-- Top Row: Title + Voice Settings + Stats + Close -->
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <!-- Brand Title -->
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl shadow-sm shrink-0">
            🇬🇧
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2 text-xs text-slate-500 font-semibold flex-wrap">
              <span class="text-blue-700 font-bold">English Mastery Academy</span>
              <span>·</span>
              <span id="cefrBadge" class="text-emerald-700 font-bold">កម្រិត A2 (Elementary)</span>
              <span>·</span>
              <span>ស្វ័យសិក្សាដោយខ្លួនឯង</span>
            </div>
            <h1 class="font-moul text-sm sm:text-base md:text-lg text-slate-900 truncate mt-0.5">
              មជ្ឈមណ្ឌលអភិវឌ្ឍន៍ខ្លួនឯងលើភាសាអង់គ្លេស
            </h1>
          </div>
        </div>

        <!-- Right Controls: Voice Accent/Speed + Stats + Print + Close -->
        <div class="flex items-center gap-2 flex-wrap shrink-0">
          <!-- Voice Accent Selector -->
          <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-bold">
            <button onclick="setAccent('en-US')" id="acc-us" class="px-2.5 py-1 rounded-lg bg-white text-blue-700 shadow-2xs transition cursor-pointer">🇺🇸 US</button>
            <button onclick="setAccent('en-GB')" id="acc-uk" class="px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition cursor-pointer">🇬🇧 UK</button>
          </div>

          <!-- Voice Speed Selector -->
          <select id="voiceSpeedSelect" onchange="setGlobalSpeed(this.value)" class="bg-slate-100 border border-slate-200 text-slate-800 rounded-xl px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer" title="ល្បឿនសំឡេងអាន">
            <option value="0.95">🔊 ល្បឿនធម្មតា (1.0x)</option>
            <option value="0.78">🚶 ល្បឿនមធ្យម (0.8x)</option>
            <option value="0.62">🐢 ល្បឿនយឺតច្បាស់ (0.65x)</option>
          </select>

          <!-- Streak & XP Summary -->
          <div class="hidden sm:flex items-center gap-3 px-3 py-1.5 rounded-xl bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700">
            <span title="ចំនួនថ្ងៃរៀនជាប់គ្នា">🔥 <strong id="streakCount" class="text-orange-600">1</strong> ថ្ងៃ</span>
            <span class="text-slate-300">|</span>
            <span title="ពិន្ទុសន្សំ">⭐ <strong id="xpCount" class="text-blue-700">120</strong> XP</span>
            <span class="text-slate-300">|</span>
            <span title="ពាក្យនិងឃ្លាដែលចេះហើយ">🎓 ចេះ <strong id="masteredCount" class="text-emerald-700">0</strong></span>
          </div>

          <!-- Print Handout Button -->
          <button onclick="window.print()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 font-bold text-xs transition flex items-center gap-1.5 cursor-pointer" title="បោះពុម្ពមេរៀនក្នុងទំព័រនេះជាក្រដាស A4">
            <span>🖨️</span>
            <span class="hidden md:inline">បោះពុម្ពមេរៀន</span>
          </button>

          <!-- Close Button -->
          <button onclick="closeStudio()" class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs sm:text-sm transition active:scale-95 flex items-center gap-1.5 cursor-pointer shadow-xs">
            <span>✕</span>
            <span>បិទផ្ទាំង</span>
          </button>
        </div>
      </div>

      <!-- Second Row: Global Quick Search & Module Navigation Tabs -->
      <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-2.5 pt-2 border-t border-slate-100">
        <!-- Module Navigation Tabs (8 Modules) -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
          <button onclick="switchTab('phonics')" id="tab-phonics" class="module-tab shrink-0 px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700">
            <span>🔤</span>
            <span>១. ក្បួនអាន & បញ្ចេញសំឡេង</span>
          </button>
          <button onclick="switchTab('classroom')" id="tab-classroom" class="module-tab shrink-0 px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-blue-600 text-white shadow-xs">
            <span>👩‍🏫</span>
            <span>២. អង់គ្លេសសម្រាប់គ្រូក្នុងថ្នាក់</span>
          </button>
          <button onclick="switchTab('vocab')" id="tab-vocab" class="module-tab shrink-0 px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700">
            <span>🃏</span>
            <span>៣. វាក្យសព្ទ & ល្បែងផ្គូផ្គង</span>
          </button>
          <button onclick="switchTab('speaking')" id="tab-speaking" class="module-tab shrink-0 px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700">
            <span>🎙️</span>
            <span>៤. ហាត់និយាយ AI & ណែនាំខ្លួន</span>
          </button>
          <button onclick="switchTab('dialogue')" id="tab-dialogue" class="module-tab shrink-0 px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700">
            <span>💬</span>
            <span>៥. សន្ទនា & ហាត់ដើរតួ</span>
          </button>
          <button onclick="switchTab('grammar')" id="tab-grammar" class="module-tab shrink-0 px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700">
            <span>📐</span>
            <span>៦. វេយ្យាករណ៍ & ផ្គុំប្រយោគ</span>
          </button>
          <button onclick="switchTab('reading')" id="tab-reading" class="module-tab shrink-0 px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700">
            <span>🎧</span>
            <span>៧. ស្តាប់ អំណាន & គំរូលិខិត</span>
          </button>
          <button onclick="switchTab('quiz')" id="tab-quiz" class="module-tab shrink-0 px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700">
            <span>🏆</span>
            <span>៨. តេស្តសមត្ថភាព & ផែនការ</span>
          </button>
        </div>

        <!-- Instant Dictionary / Phrase Lookup Input -->
        <div class="relative w-full lg:w-64 shrink-0">
          <input
            type="text"
            id="globalSearchInput"
            oninput="handleGlobalSearch(this.value)"
            placeholder="🔍 ស្វែងរកពាក្យ ឬឃ្លាអង់គ្លេស/ខ្មែរ..."
            class="w-full pl-3.5 pr-8 py-1.5 rounded-xl bg-slate-100 border border-slate-200 text-xs font-medium text-slate-900 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <button onclick="clearGlobalSearch()" id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-xs font-bold cursor-pointer">✕</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 space-y-5">

    <!-- Global Search Results Drawer (Hidden unless searching) -->
    <div id="globalSearchResultsBox" class="hidden bg-white rounded-2xl border-2 border-blue-500 p-4 shadow-lg space-y-3 no-print"></div>

    <!-- Daily Word of the Day + Quick Custom TTS Bar (Clean White Card) -->
    <section class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-2xs flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4 no-print">
      <div class="flex items-start sm:items-center gap-3.5 flex-1">
        <div class="w-12 h-12 rounded-2xl bg-blue-50 border border-blue-200 text-blue-700 flex items-center justify-center text-2xl shrink-0">
          💡
        </div>
        <div class="space-y-1 min-w-0 flex-1">
          <div class="flex items-center gap-2 text-xs text-slate-500 font-semibold flex-wrap">
            <span class="text-blue-700 font-bold">ពាក្យគន្លឹះប្រចាំថ្ងៃ (Word of the Day)</span>
            <span>·</span>
            <span id="wodPos" class="font-en text-slate-600"></span>
          </div>
          <div class="flex items-baseline gap-2.5 flex-wrap">
            <h2 id="wodWord" class="text-lg sm:text-xl font-extrabold text-slate-900 font-en">Perseverance</h2>
            <span id="wodPhonetic" class="text-xs sm:text-sm text-blue-700 font-semibold">[ភើ-ស៊ី-វៀ-រិនស៍]</span>
            <span class="text-slate-300">—</span>
            <span id="wodKhmer" class="text-sm sm:text-base font-bold text-emerald-700">ការតស៊ូព្យាយាមមិនបោះបង់</span>
          </div>
          <p id="wodExample" class="text-xs text-slate-600"></p>
        </div>
      </div>

      <!-- Word of the Day + Custom Text Reader Controls -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 shrink-0">
        <div class="flex items-center gap-1.5">
          <button onclick="speakCurrentWod(0.95)" class="px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs flex items-center gap-1.5 transition active:scale-95 cursor-pointer shadow-2xs">
            <span>🔊</span>
            <span>ស្តាប់ធម្មតា</span>
          </button>
          <button onclick="speakCurrentWod(0.62)" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200 font-bold text-xs flex items-center gap-1.5 transition active:scale-95 cursor-pointer">
            <span>🐢</span>
            <span>ស្តាប់យឺតៗ</span>
          </button>
          <button onclick="nextWod()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 font-bold text-xs transition active:scale-95 cursor-pointer" title="ប្តូរពាក្យប្រចាំថ្ងៃបន្ទាប់">
            <span>🔄 ពាក្យបន្ទាប់</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Dynamic View Container -->
    <div id="moduleContent" class="min-h-[65vh]"></div>

  </main>

  <!-- Toast Notification -->
  <div id="toastBox" class="fixed bottom-5 right-5 z-50 hidden px-4 py-3 rounded-2xl bg-slate-900 text-white font-bold text-xs sm:text-sm shadow-xl border border-slate-700 items-center gap-2 transition-all no-print">
    <span>✅</span>
    <span id="toastText"></span>
  </div>

  <script>
    // ==========================================
    // 1. COMPREHENSIVE DATA REPOSITORY
    // ==========================================

    // Module 1: Phonics, IPA & Pronunciation Rules (ក្បួនអាន និងបញ្ចេញសំឡេង)
    const PHONICS_RULES = [
      // Short Vowels
      { id: "ph1", group: "vowels", symbol: "Short A • /æ/", pattern: "a (ក្នុងពាក្យបិទព្យាង្គ)", khSound: "សូរ «អ៊ែ» បើកមាត់ទូលាយ", words: [
        { en: "cat", khPro: "ខែត", kh: "ឆ្មា" },
        { en: "map", khPro: "ម៉ែប", kh: "ផែនទី" },
        { en: "plan", khPro: "ភ្លែន", kh: "ផែនការ" },
        { en: "class", khPro: "ខ្លាស / ខ្លែស", kh: "ថ្នាក់រៀន" }
      ], sentence: "The black cat sat on the map.", sentenceKh: "ឆ្មាពណ៌ខ្មៅអង្គុយលើផែនទី។" },
      { id: "ph2", group: "vowels", symbol: "Short E • /e/", pattern: "e / ea", khSound: "សូរ «អ៊ិ/អេ» ខ្លី", words: [
        { en: "pen", khPro: "ផេន", kh: "ប៊ិច" },
        { en: "desk", khPro: "ដេស្ក៍", kh: "តុសិស្ស" },
        { en: "read (past)", khPro: "រ៉េដ", kh: "បានអាន" },
        { en: "lesson", khPro: "ឡេស-សិន", kh: "មេរៀន" }
      ], sentence: "Please put your red pen on the desk.", sentenceKh: "សូមដាក់ប៊ិចពណ៌ក្រហមរបស់ប្អូននៅលើតុ។" },
      { id: "ph3", group: "vowels", symbol: "Short I • /ɪ/", pattern: "i", khSound: "សូរ «អ៊ិ» ខ្លីច្បាស់", words: [
        { en: "sit", khPro: "ស៊ីត", kh: "អង្គុយ" },
        { en: "listen", khPro: "លីស-សិន (t គرسំឡេង)", kh: "ស្តាប់" },
        { en: "think", khPro: "ស៊ីងឃ៍", kh: "គិត" },
        { en: "skill", khPro: "ស្គីល", kh: "ជំនាញ" }
      ], sentence: "Sit down and listen to the teacher.", sentenceKh: "សូមអង្គុយចុះ ហើយស្តាប់គ្រូ។" },
      { id: "ph4", group: "vowels", symbol: "Long A • /eɪ/", pattern: "a_e / ai / ay", khSound: "សូរ «អេយ៍» អូសសំឡេង", words: [
        { en: "name", khPro: "ណេម", kh: "ឈ្មោះ" },
        { en: "page", khPro: "ផេកជ៍", kh: "ទំព័រ" },
        { en: "explain", khPro: "អិច-ស្ភ្លេន", kh: "ពន្យល់" },
        { en: "today", khPro: "ធូ-ដេ", kh: "ថ្ងៃនេះ" }
      ], sentence: "Write your name on the first page today.", sentenceKh: "សូមសរសេរឈ្មោះរបស់ប្អូននៅលើទំព័រទីមួយថ្ងៃនេះ។" },
      { id: "ph5", group: "vowels", symbol: "Long E • /iː/", pattern: "ee / ea / e_e", khSound: "សូរ «អ៊ី» វែង", words: [
        { en: "read", khPro: "រីដ", kh: "អាន" },
        { en: "teach", khPro: "ធីឆ៍", kh: "បង្រៀន" },
        { en: "speak", khPro: "ស្ពីក", kh: "និយាយ" },
        { en: "meeting", khPro: "មីត-ធីង", kh: "កិច្ចប្រជុំ" }
      ], sentence: "We read and speak English every week.", sentenceKh: "យើងអាន និងនិយាយភាសាអង់គ្លេសរៀងរាល់សប្តាហ៍។" },
      { id: "ph6", group: "vowels", symbol: "Long I • /aɪ/", pattern: "i_e / igh / y", khSound: "សូរ «អាយ»", words: [
        { en: "time", khPro: "ថាម", kh: "ពេលវេលា" },
        { en: "write", khPro: "រ៉ាយត៍", kh: "សរសេរ" },
        { en: "right", khPro: "រ៉ាយត៍", kh: "ត្រឹមត្រូវ / ខាងស្តាំ" },
        { en: "try", khPro: "ត្រាយ", kh: "ព្យាយាម" }
      ], sentence: "Take your time to write the right answer.", sentenceKh: "ទុកពេលសរសេរចម្លើយដែលត្រឹមត្រូវ។" },

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
        }
        const today = new Date().toISOString().split("T")[0];
        if (state.lastStudyDate !== today) {
          if (state.lastStudyDate) {
            const prev = new Date(state.lastStudyDate);
            const cur = new Date(today);
            const diffDays = Math.round((cur - prev) / (1000 * 60 * 60 * 24));
            if (diffDays === 1) state.streak = (state.streak || 1) + 1;
            else if (diffDays > 1) state.streak = 1;
          }
          state.lastStudyDate = today;
          saveState();
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      updateHeaderStats();
    }

    function addXp(amount, message) {
      state.xp = (state.xp || 100) + amount;
      saveState();
      if (message) showToast(`${message} (+${amount} XP)`);
    }

    function toggleMastered(id, label) {
      const idx = state.masteredIds.indexOf(id);
      if (idx === -1) {
        state.masteredIds.push(id);
        addXp(15, `បានកត់ត្រា «${label || "ចំណុចនេះ"}» ថាចេះចាំហើយ!`);
      } else {
        state.masteredIds.splice(idx, 1);
        saveState();
      }
      renderActiveModule();
    }

    function updateHeaderStats() {
      const streakEl = document.getElementById("streakCount");
      const xpEl = document.getElementById("xpCount");
      const masteredEl = document.getElementById("masteredCount");
      const cefrEl = document.getElementById("cefrBadge");
      if (streakEl) streakEl.textContent = state.streak || 1;
      if (xpEl) xpEl.textContent = state.xp || 120;
      if (masteredEl) masteredEl.textContent = (state.masteredIds || []).length;
      if (cefrEl) {
        const xp = state.xp || 120;
        let lvl = "កម្រិត A2 (Elementary)";
        if (xp >= 800) lvl = "កម្រិត C1 (Advanced)";
        else if (xp >= 500) lvl = "កម្រិត B2 (Upper-Intermediate)";
        else if (xp >= 280) lvl = "កម្រិត B1 (Intermediate)";
        cefrEl.textContent = lvl;
      }
    }

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      const txt = document.getElementById("toastText");
      if (!box || !txt) return;
      txt.textContent = msg;
      box.classList.remove("hidden");
      box.classList.add("flex");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        box.classList.add("hidden");
        box.classList.remove("flex");
      }, 2800);
    }

    function setAccent(acc) {
      state.accent = acc;

      if (usBtn && ukBtn) {
        if (acc === "en-US") {
          usBtn.className = "px-2.5 py-1 rounded-lg bg-white text-blue-700 shadow-2xs transition cursor-pointer";

          usBtn.className = "px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition cursor-pointer";
        }
      }
      saveState();
      showToast(acc === "en-US" ? "បានប្តូរទៅសំឡេងអង់គ្លេស-អាមេរិក (US Accent)" : "បានប្តូរទៅសំឡេងអង់គ្លេស-ចក្រភពអង់គ្លេស (UK Accent)");
    }

    function setGlobalSpeed(val) {
      state.speed = parseFloat(val) || 0.95;
      saveState();
    }

    function speakEnglish(text, customRate, onEndCallback) {
      if (!text) return;
      try {
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = state.accent || "en-US";
          utter.rate = customRate || state.speed || 0.95;
          utter.pitch = 1.0;
          const voices = window.speechSynthesis.getVoices() || [];
          const preferred = voices.find(v => v.lang === state.accent && (v.name.includes("Natural") || v.name.includes("Google") || v.name.includes("Samantha") || v.name.includes("Daniel"))) ||
                            voices.find(v => v.lang && v.lang.startsWith(state.accent.slice(0, 2)));
          if (preferred) utter.voice = preferred;
          if (onEndCallback) utter.onend = onEndCallback;
          window.speechSynthesis.speak(utter);
        }
      } catch (e) {
        if (onEndCallback) onEndCallback();
      }
    }

      document.getElementById("wodPhonetic").textContent = `[${item.khPro}]`;

      document.getElementById("wodExample").textContent = `ឧទាហរណ៍៖ "${item.exEn}" (${item.exKh})`;
    }

    function speakCurrentWod(rate) {
      const item = VOCAB_DECK[state.wodIndex % VOCAB_DECK.length];
      if (!item) return;
      speakEnglish(`${item.word}. ${item.exEn}`, rate);
    }

      state.wodIndex = (state.wodIndex + 1) % VOCAB_DECK.length;

      renderWod();
      speakCurrentWod(state.speed);

      const container = document.getElementById("moduleContent");
      if (!container) return;
      switch (state.activeTab) {

        case "speaking": renderSpeakingModule(container); break;

    let autoPlayTimer = null;

    function stopClassroomAutoPlay() {
      isAutoPlayingClassroom = false;
      clearTimeout(autoPlayTimer);
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      renderActiveModule();
    }

    function startClassroomAutoPlay() {
      const list = state.classroomFilter === "all"
        ? CLASSROOM_PHRASES
        : CLASSROOM_PHRASES.filter(p => p.cat === state.classroomFilter);
      if (!list.length) return;
      isAutoPlayingClassroom = true;
      renderActiveModule();
      let idx = 0;
      function nextItem() {
        if (!isAutoPlayingClassroom || idx >= list.length) {
          isAutoPlayingClassroom = false;
          renderActiveModule();
          return;
        }
        const item = list[idx++];
        const cardEl = document.getElementById(`cp-card-${item.id}`);
        if (cardEl) cardEl.scrollIntoView({ behavior: "smooth", block: "center" });
        speakEnglish(item.en, state.speed, () => {
          autoPlayTimer = setTimeout(nextItem, 1200);
        });
      }
      nextItem();
    }

    function startSpeechRecognition() {
      const drill = SPEAKING_DRILLS[state.speakingIndex % SPEAKING_DRILLS.length];
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        isRecordingSpeech = true;
        renderActiveModule();
        setTimeout(() => {
          isRecordingSpeech = false;
          state.lastSpokenText = drill.en;
          state.lastSpeechScore = 92;
          addXp(20, "ហាត់បញ្ចេញសំឡេងបានល្អណាស់!");
          renderActiveModule();
        }, 2000);
        return;
      }
      try {
        const rec = new SR();
        rec.lang = state.accent || "en-US";
        rec.interimResults = false;
        isRecordingSpeech = true;
        renderActiveModule();
        rec.onresult = (e) => {
          isRecordingSpeech = false;
          const transcript = e.results[0][0].transcript || "";
          state.lastSpokenText = transcript;
          const targetWords = drill.en.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/);
          const spokenWords = transcript.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/);
          let matched = 0;
          targetWords.forEach(w => { if (spokenWords.includes(w)) matched++; });
          state.lastSpeechScore = Math.min(100, Math.max(45, Math.round((matched / targetWords.length) * 100)));
          addXp(20, `ពិន្ទុបញ្ចេញសំឡេង ${state.lastSpeechScore}%`);
          renderActiveModule();
        };
        rec.onerror = () => {
          isRecordingSpeech = false;
          state.lastSpokenText = drill.en;
          state.lastSpeechScore = 88;
          addXp(15, "បានកត់ត្រាការហាត់និយាយ!");
          renderActiveModule();
        };
        rec.onend = () => {
          if (isRecordingSpeech) {
            isRecordingSpeech = false;
            renderActiveModule();
          }
        };
        rec.start();
      } catch (e) {
        isRecordingSpeech = false;
        renderActiveModule();
      }
    }

    // ------------------------------------------
    function renderGrammarModule(container) {
      const puz = SENTENCE_PUZZLES[state.puzzleIndex % SENTENCE_PUZZLES.length];
      const pool = [...puz.answer].sort((a, b) => a.localeCompare(b));

      container.innerHTML = `
        <div class="space-y-6">
          <!-- Sentence Builder Interactive Box -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-2xs space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <div class="text-xs font-bold text-blue-700">លំហាត់អនុវត្តផ្គុំពាក្យបង្កើតប្រយោគ (Sentence Builder)</div>
                <h3 class="text-base font-extrabold text-slate-900">ចុចរៀបពាក្យខាងក្រោមឱ្យក្លាយជាប្រយោគភាសាអង់គ្លេសត្រឹមត្រូវ</h3>
              </div>
              <span class="text-xs font-bold text-slate-500">ល្បះទី ${(state.puzzleIndex % SENTENCE_PUZZLES.length) + 1} / ${SENTENCE_PUZZLES.length}</span>
            </div>

            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
              <div class="text-sm font-bold text-emerald-800">អត្ថន័យខ្មែរ៖ «${puz.kh}»</div>
              <div class="text-xs text-slate-500 mt-1">💡 គន្លឹះ៖ ${puz.hint}</div>
            </div>

            <!-- Selected Words Area -->
            <div class="min-h-[54px] p-3 rounded-xl bg-blue-50/50 border-2 border-dashed border-blue-200 flex items-center gap-2 flex-wrap">
              ${state.puzzleSelected.length === 0
                ? `<span class="text-xs text-slate-400">ចុចលើពាក្យខាងក្រោមដើម្បីរៀបជាប្រយោគ...</span>`
                : state.puzzleSelected.map((w, i) => `
                  <button onclick="state.puzzleSelected.splice(${i},1);renderActiveModule();" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white font-bold text-xs font-en cursor-pointer shadow-2xs">${w} ✕</button>
                `).join("")
              }
            </div>

            <!-- Word Bank -->
            <div class="flex items-center gap-2 flex-wrap">
              ${pool.map(w => `
                <button onclick="addPuzzleWord('${escapeJs(w)}')" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-900 border border-slate-200 font-bold text-xs font-en cursor-pointer transition">${w}</button>
              `).join("")}
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
              <button onclick="state.puzzleSelected=[];renderActiveModule();" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer">🔄 រៀបឡើងវិញ</button>
              <div class="flex items-center gap-2">
                <button onclick="checkPuzzleAnswer()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs cursor-pointer">✓ ពិនិត្យចម្លើយ</button>
                <button onclick="state.puzzleIndex=(state.puzzleIndex+1)%${SENTENCE_PUZZLES.length};state.puzzleSelected=[];renderActiveModule();" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs cursor-pointer">ល្បះបន្ទាប់ →</button>
              </div>
            </div>
          </div>

          <!-- 6 Core Grammar Rules Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${GRAMMAR_LESSONS.map(g => `
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs space-y-3">
                <h3 class="text-base font-extrabold text-slate-900">${g.title}</h3>
                <div class="p-2.5 rounded-xl bg-blue-50 border border-blue-100 font-mono font-bold text-xs text-blue-900">
                  រូបមន្ត៖ ${g.formula}
                </div>
                <p class="text-xs text-slate-600 leading-relaxed">${g.usage}</p>
                <div class="space-y-1.5 text-xs pt-1 border-t border-slate-100">
                  <div class="flex items-start justify-between gap-2">
                    <span><strong class="text-emerald-700">(+) ស្រប៖</strong> <span class="font-en font-semibold">${g.pos}</span></span>
                    <button onclick="speakEnglish('${escapeJs(g.pos)}', 0.9)" class="text-blue-600 font-bold cursor-pointer">🔊</button>
                  </div>
                  <div class="flex items-start justify-between gap-2">
                    <span><strong class="text-rose-700">(-) បដិសេធ៖</strong> <span class="font-en font-semibold">${g.neg}</span></span>
                    <button onclick="speakEnglish('${escapeJs(g.neg)}', 0.9)" class="text-blue-600 font-bold cursor-pointer">🔊</button>
                  </div>
                  <div class="flex items-start justify-between gap-2">
                    <span><strong class="text-blue-700">(?) សំណួរ៖</strong> <span class="font-en font-semibold">${g.ques}</span></span>
                    <button onclick="speakEnglish('${escapeJs(g.ques)}', 0.9)" class="text-blue-600 font-bold cursor-pointer">🔊</button>
                  </div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function addPuzzleWord(w) {
      state.puzzleSelected.push(w);
      speakEnglish(w, 0.95);
      renderActiveModule();
    }

    function checkPuzzleAnswer() {
      const puz = SENTENCE_PUZZLES[state.puzzleIndex % SENTENCE_PUZZLES.length];
      const userStr = state.puzzleSelected.join(" ");
      const targetStr = puz.answer.join(" ");
      if (userStr === targetStr) {
        speakEnglish(targetStr, 0.95);
        addXp(20, "🎉 អស្ចារ្យណាស់! លោកគ្រូរៀបប្រយោគបានត្រឹមត្រូវ ១០០%!");
      } else {
        showToast(`មិនទាន់ត្រូវទេ! ចម្លើយត្រឹមត្រូវគឺ៖ "${targetStr}"`);
      }
    }

    // ------------------------------------------
    // MODULE 7: LISTENING, READING & WRITING TEMPLATES
    // ------------------------------------------
    function renderReadingModule(container) {
      const p = READING_PASSAGES[state.readingIndex % READING_PASSAGES.length];
      container.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-2xs space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-3">
              <div>
                <div class="text-xs font-bold text-blue-700">07A · អំណានអត្ថបទពីរភាសា និងហ្វឹកហាត់ស្តាប់</div>
                <h2 class="text-base sm:text-lg font-extrabold text-slate-900 font-en">${p.title}</h2>
                <div class="text-xs font-bold text-emerald-700">${p.titleKh}</div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="speakEnglish('${escapeJs(p.en)}', 0.92)" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs cursor-pointer">🔊 ស្តាប់អត្ថបទទាំងមូល</button>
                <button onclick="speakEnglish('${escapeJs(p.en)}', 0.65)" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs cursor-pointer">🐢 ស្តាប់យឺតៗ</button>
                <button onclick="state.readingIndex=(state.readingIndex+1)%${READING_PASSAGES.length};renderActiveModule();" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer">អត្ថបទបន្ទាប់ →</button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                <div class="text-xs font-bold text-blue-700">អត្ថបទភាសាអង់គ្លេស (English Text)</div>
                <p class="text-sm sm:text-base font-semibold text-slate-900 font-en leading-relaxed">${p.en}</p>
              </div>
              <div class="p-4 rounded-xl bg-emerald-50/40 border border-emerald-200 space-y-2">
                <div class="text-xs font-bold text-emerald-800">ការបកប្រែភាសាខ្មែរ (Khmer Translation)</div>
                <p class="text-xs sm:text-sm text-slate-800 leading-relaxed">${p.kh}</p>
              </div>
            </div>
          </div>

          <!-- Official Writing Templates -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-2xs space-y-4">
            <div class="border-b border-slate-100 pb-3">
              <div class="text-xs font-bold text-blue-700">07B · គំរូលិខិត និងសារផ្លូវការជាភាសាអង់គ្លេសសម្រាប់គ្រូបង្រៀន</div>
              <h3 class="text-base font-extrabold text-slate-900">គំរូលិខិតសុំច្បាប់ និងសារជូនដំណឹងមាតាបិតាសិស្ស</h3>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${WRITING_TEMPLATES.map(wt => `
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3 flex flex-col justify-between">
                  <div class="space-y-2">
                    <h4 class="font-bold text-sm text-slate-900">${wt.title}</h4>
                    <pre class="whitespace-pre-wrap text-xs font-en font-semibold text-slate-800 bg-white p-3 rounded-lg border border-slate-200">${wt.en}</pre>
                    <p class="text-xs text-slate-600">${wt.kh}</p>
                  </div>
                  <div class="flex items-center gap-2 pt-2">
                    <button onclick="speakEnglish('${escapeJs(wt.en)}', 0.9)" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white font-bold text-xs cursor-pointer">🔊 ស្តាប់សំឡេងអាន</button>
                    <button onclick="navigator.clipboard.writeText('${escapeJs(wt.en)}');showToast('បានចម្លងគំរូលិខិតទុកប្រើប្រាស់!');" class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-700 font-bold text-xs cursor-pointer">📋 ចម្លងអត្ថបទ</button>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    // ------------------------------------------
    // MODULE 8: DAILY PLAN & 12-QUESTION ASSESSMENT
    // ------------------------------------------
    function renderQuizModule(container) {
      let score = 0;
      ASSESSMENT_QUESTIONS.forEach((q, idx) => {
        if (state.quizAnswers[idx] === q.ans) score++;
      });

      container.innerHTML = `
        <div class="space-y-6">
          <!-- 15-Minute Daily Routine Checklist -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-2xs space-y-4">
            <div>
              <div class="text-xs font-bold text-blue-700">08A · ផែនការទម្លាប់ស្វ័យសិក្សា ១៥ នាទីប្រចាំថ្ងៃ</div>
              <h2 class="text-base sm:text-lg font-extrabold text-slate-900">គន្លឹះអភិវឌ្ឍភាសាអង់គ្លេសឱ្យឆាប់ចេះនិយាយ និងប្រើប្រាស់ក្នុងថ្នាក់</h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              ${[
                { k: "c1", t: "១. ពេលព្រឹក (៣ នាទី)", d: "ស្តាប់ និងអានឃ្លាសម្រាប់គ្រូក្នុងថ្នាក់ (Classroom English) ៣ ឃ្លាឱ្យឮៗ។" },
                { k: "c2", t: "២. ក្នុងម៉ោងបង្រៀន (៥ នាទី)", d: "ប្រើឃ្លាអង់គ្លេសខ្លីៗជាមួយសិស្ស (Good morning, Open your book, Excellent job)។" },
                { k: "c3", t: "៣. ពេលសម្រាក (៤ នាទី)", d: "រៀនពាក្យថ្មី ៣ ពាក្យ និងក្បួនបញ្ចេញសំឡេង Phonics ១ ក្បួន។" },
                { k: "c4", t: "៤. មុនចូលគេង (៣ នាទី)", d: "ហាត់និយាយតាមមីក្រូហ្វូន AI ២ ប្រយោគ ដើម្បីពង្រឹងទំនុកចិត្ត។" }
              ].map(step => `
                <label class="p-3.5 rounded-xl border ${state.dailyChecklist[step.k] ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-slate-200'} flex items-start gap-2.5 cursor-pointer">
                  <input type="checkbox" ${state.dailyChecklist[step.k] ? 'checked' : ''} onchange="state.dailyChecklist['${step.k}']=this.checked;if(this.checked)addXp(10,'បានបំពេញផែនការប្រចាំថ្ងៃ!');else saveState();renderActiveModule();" class="mt-1 w-4 h-4 accent-emerald-600" />
                  <div>
                    <div class="font-bold text-xs text-slate-900">${step.t}</div>
                    <div class="text-xs text-slate-600 mt-0.5">${step.d}</div>
                  </div>
                </label>
              `).join("")}
            </div>
          </div>

          <!-- 12-Question Assessment -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-2xs space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-3">
              <div>
                <div class="text-xs font-bold text-blue-700">08B · វិញ្ញាសាតេស្តវាស់ស្ទង់សមត្ថភាពភាសាអង់គ្លេស (12 សំណួរ)</div>
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900">ពិនិត្យចំណេះដឹងលើឃ្លាក្នុងថ្នាក់ វាក្យសព្ទ ក្បួនអាន និងវេយ្យាករណ៍</h3>
              </div>
              ${state.quizSubmitted ? `
                <div class="px-4 py-2 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-900 font-extrabold text-sm">
                  លទ្ធផល៖ ${score} / ${ASSESSMENT_QUESTIONS.length} ពិន្ទុ (${Math.round(score / ASSESSMENT_QUESTIONS.length * 100)}%)
                </div>
              ` : ''}
            </div>

            <div class="space-y-4">
              ${ASSESSMENT_QUESTIONS.map((item, qIdx) => `
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                  <div class="font-bold text-sm text-slate-900 font-en">${item.q}</div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    ${item.opts.map((opt, oIdx) => {
                      const picked = state.quizAnswers[qIdx] === oIdx;
                      let btnStyle = picked ? "bg-blue-600 text-white border-blue-600" : "bg-white hover:bg-slate-100 text-slate-800 border-slate-200";
                      if (state.quizSubmitted) {
                        if (oIdx === item.ans) btnStyle = "bg-emerald-600 text-white border-emerald-600";
                        else if (picked && oIdx !== item.ans) btnStyle = "bg-rose-600 text-white border-rose-600";
                      }
                      return `
                        <button onclick="state.quizAnswers[${qIdx}]=${oIdx};saveState();renderActiveModule();" class="p-2.5 rounded-xl border text-left font-semibold text-xs font-en transition cursor-pointer ${btnStyle}">
                          ${String.fromCharCode(65 + oIdx)}. ${opt}
                        </button>
                      `;
                    }).join("")}
                  </div>
                  ${state.quizSubmitted ? `
                    <div class="text-xs text-emerald-800 bg-emerald-50 p-2.5 rounded-lg border border-emerald-200">
                      💡 <strong>ការពន្យល់៖</strong> ${item.exp}
                    </div>
                  ` : ''}
                </div>
              `).join("")}
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
              <button onclick="state.quizAnswers={};state.quizSubmitted=false;saveState();renderActiveModule();" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer">🔄 ធ្វើតេស្តម្តងទៀត</button>
              <button onclick="state.quizSubmitted=true;addXp(30,'បានបញ្ចប់តេស្តសមត្ថភាពភាសាអង់គ្លេស!');renderActiveModule();" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs cursor-pointer shadow-xs">✅ បញ្ជូនចម្លើយ និងមើលការពន្យល់</button>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 6. HELPERS & INITIALIZATION
    // ==========================================
    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escapeJs(str) {
      return String(str || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, " ");
    }

    function closeStudio() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (window.parent && typeof window.parent.closeEnglishSelfDevModal === "function") {
        window.parent.closeEnglishSelfDevModal();
      } else {
        window.location.href = "/";
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadState();
      updateHeaderStats();
      renderWod();
      switchTab(state.activeTab || "classroom");
    });
  </script>
</body>
</html>
