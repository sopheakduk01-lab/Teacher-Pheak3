<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>អភិវឌ្ឍន៍ខ្លួនឯងលើភាសាអង់គ្លេស • English Mastery Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-kh: 'Kantumruy Pro', 'Battambang', sans-serif;
      --font-moul: 'Moul', serif;
      --font-en: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: var(--font-kh);
      background: #070b19;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .font-moul { font-family: var(--font-moul); }
    .font-en { font-family: var(--font-en); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 3D Flip Card */
    .perspective-1000 { perspective: 1000px; }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1.5rem;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    @keyframes pulseRing {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .mic-recording {
      animation: pulseRing 1.4s infinite;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float { animation: floatSlow 3.5s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col selection:bg-amber-400 selection:text-slate-950">

  <!-- Ambient Background Glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-indigo-600/20 blur-3xl"></div>
    <div class="absolute top-1/3 -right-32 w-96 h-96 rounded-full bg-emerald-500/15 blur-3xl"></div>
    <div class="absolute -bottom-32 left-1/3 w-96 h-96 rounded-full bg-amber-500/15 blur-3xl"></div>
  </div>

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-xl border-b border-white/10 px-3 sm:px-6 py-2.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 flex-wrap">
      <!-- Brand Title -->
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-br from-blue-500 via-indigo-600 to-amber-400 p-0.5 shadow-lg shadow-indigo-500/30 shrink-0">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-xl sm:text-2xl">
            🇬🇧
          </div>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="px-2 py-0.5 rounded-full bg-amber-400/20 border border-amber-400/40 text-amber-300 text-[10px] font-black uppercase tracking-wider">English Self-Development Pro</span>
            <span id="cefrBadge" class="px-2 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 text-[10px] font-bold">Level A2 • Elementary</span>
          </div>
          <h1 class="font-moul text-xs sm:text-base md:text-lg text-transparent bg-clip-text bg-gradient-to-r from-white via-amber-200 to-sky-300 truncate mt-0.5">
            មជ្ឈមណ្ឌលអភិវឌ្ឍន៍ខ្លួនឯងលើភាសាអង់គ្លេស
          </h1>
        </div>
      </div>

      <!-- Stats & Action Controls -->
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <!-- Streak -->
        <div class="px-2.5 sm:px-3 py-1.5 rounded-xl bg-orange-500/15 border border-orange-400/30 flex items-center gap-1.5" title="ចំនួនថ្ងៃរៀនជាប់គ្នា (Daily Streak)">
          <span class="text-sm sm:text-base">🔥</span>
          <div class="leading-tight">
            <div class="text-[9px] text-orange-300 font-bold uppercase">Streak</div>
            <div class="text-xs sm:text-sm font-black text-white"><span id="streakCount">1</span> ថ្ងៃ</div>
          </div>
        </div>

        <!-- XP Score -->
        <div class="px-2.5 sm:px-3 py-1.5 rounded-xl bg-amber-400/15 border border-amber-400/30 flex items-center gap-1.5" title="ពិន្ទុសន្សំការរៀន (Total XP)">
          <span class="text-sm sm:text-base">⭐</span>
          <div class="leading-tight">
            <div class="text-[9px] text-amber-300 font-bold uppercase">Mastery XP</div>
            <div class="text-xs sm:text-sm font-black text-amber-300" id="xpCount">100</div>
          </div>
        </div>

        <!-- Mastered Words Count -->
        <div class="hidden md:flex px-3 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-400/30 items-center gap-1.5">
          <span class="text-base">🎓</span>
          <div class="leading-tight">
            <div class="text-[9px] text-emerald-300 font-bold uppercase">ចេះចាំ</div>
            <div class="text-xs sm:text-sm font-black text-emerald-300"><span id="masteredCount">0</span> ពាក្យ/ឃ្លា</div>
          </div>
        </div>

        <!-- Close / Back Button -->
        <button onclick="closeStudio()" class="px-3 sm:px-4 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-600 text-rose-200 hover:text-white border border-rose-400/30 font-bold text-xs sm:text-sm transition active:scale-95 flex items-center gap-1.5 cursor-pointer">
          <span>✕</span>
          <span class="hidden sm:inline">បិទផ្ទាំង</span>
        </button>

    </div>

    <!-- Module Navigation Tabs -->
    <div class="max-w-7xl mx-auto mt-2.5 pt-2 border-t border-white/10 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
      <button onclick="switchTab('classroom')" id="tab-classroom" class="module-tab shrink-0 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-gradient-to-r from-amber-400 to-yellow-400 text-slate-950 shadow-md">
        <span>👩‍🏫</span>
        <span>១. អង់គ្លេសសម្រាប់គ្រូក្នុងថ្នាក់</span>
      </button>
      <button onclick="switchTab('vocab')" id="tab-vocab" class="module-tab shrink-0 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-white/10 hover:bg-white/15 text-slate-200">
        <span>🃏</span>
        <span>២. វាក្យសព្ទ & Flashcards 3D</span>
      </button>
      <button onclick="switchTab('speaking')" id="tab-speaking" class="module-tab shrink-0 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-white/10 hover:bg-white/15 text-slate-200">
        <span>🎙️</span>
        <span>៣. បន្ទប់ហ្វឹកហាត់បញ្ចេញសំឡេង AI</span>
      </button>
      <button onclick="switchTab('dialogue')" id="tab-dialogue" class="module-tab shrink-0 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-white/10 hover:bg-white/15 text-slate-200">
        <span>💬</span>
        <span>៤. សន្ទនាស្ថានភាពជាក់ស្តែង</span>
      </button>
      <button onclick="switchTab('grammar')" id="tab-grammar" class="module-tab shrink-0 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-white/10 hover:bg-white/15 text-slate-200">
        <span>📐</span>
        <span>៥. វេយ្យាករណ៍ & ផ្គុំល្បះ</span>
      </button>
      <button onclick="switchTab('reading')" id="tab-reading" class="module-tab shrink-0 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-white/10 hover:bg-white/15 text-slate-200">
        <span>🎧</span>
        <span>៦. ស្តាប់ & អំណានអត្ថបទ</span>
      </button>
      <button onclick="switchTab('quiz')" id="tab-quiz" class="module-tab shrink-0 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer bg-white/10 hover:bg-white/15 text-slate-200">
        <span>🏆</span>
        <span>៧. តេស្តសមត្ថភាព & ផែនការប្រចាំថ្ងៃ</span>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="relative z-10 flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 space-y-6">

    <!-- Daily Word of the Day + Daily Progress Banner -->
    <section class="rounded-3xl bg-gradient-to-r from-indigo-950/90 via-slate-900/95 to-emerald-950/90 border border-indigo-400/30 p-4 sm:p-5 shadow-xl flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
      <div class="flex items-start sm:items-center gap-3.5 flex-1">
        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-amber-400/20 border border-amber-400/40 flex items-center justify-center text-2xl sm:text-3xl shrink-0 animate-float">
          💡
        </div>
        <div class="space-y-1 min-w-0 flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-[10px] font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-amber-400 text-slate-950">🌟 ពាក្យគន្លឹះប្រចាំថ្ងៃ (Word of the Day)</span>
            <span id="wodPos" class="text-xs text-sky-300 font-en font-bold"></span>
          </div>
          <div class="flex items-baseline gap-2.5 flex-wrap">
            <h2 id="wodWord" class="text-lg sm:text-2xl font-black text-white font-en">Perseverance</h2>
            <span id="wodPhonetic" class="text-xs sm:text-sm text-amber-300 font-semibold">[ភើ-ស៊ី-វៀ-រិនស៍]</span>
            <span id="wodKhmer" class="text-sm sm:text-base font-bold text-emerald-300">ការតស៊ូព្យាយាមមិនបោះបង់</span>
          </div>
          <p id="wodExample" class="text-xs text-slate-300 italic"></p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0 flex-wrap">
        <button onclick="speakCurrentWod(1.0)" class="px-3.5 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-xs flex items-center gap-1.5 transition active:scale-95 cursor-pointer shadow-md">
          <span>🔊</span>
          <span>ស្តាប់សំឡេងធម្មតា</span>
        </button>
        <button onclick="speakCurrentWod(0.7)" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white font-bold text-xs flex items-center gap-1.5 border border-white/15 transition active:scale-95 cursor-pointer">
          <span>🐢</span>
          <span>ស្តាប់យឺតៗច្បាស់ៗ</span>
        </button>
        <button onclick="nextWod()" class="px-3 py-2 rounded-xl bg-amber-400/20 hover:bg-amber-400/30 text-amber-300 border border-amber-400/30 font-bold text-xs transition active:scale-95 cursor-pointer">
          <span>🔄 ពាក្យបន្ទាប់</span>
        </button>

    <!-- Dynamic View Container -->

  <!-- Toast Notification -->

    <span>✨</span>
    <span id="toastText"></span>
  </div>

  <script>
    // ==========================================
    // 1. COMPREHENSIVE DATA REPOSITORY
    // ==========================================

    // Module 1: Classroom English for Cambodian Teachers
    const CLASSROOM_PHRASES = [
      // Category: Starting Class
      { id: "cp1", cat: "start", en: "Good morning, everyone! How are you today?", khPhonetic: "គូដ ម៉នីង អេវរីវ៉ាន់! ហៅ អា យូ ធូដេ?", kh: "អរុណសួស្តីអ្នកទាំងអស់គ្នា! តើថ្ងៃនេះអ្នកទាំងអស់គ្នាសុខសប្បាយជាទេ?", tip: "ប្រើនៅពេលដើរចូលថ្នាក់រៀនពេលព្រឹក ដោយទឹកមុខញញឹមរាក់ទាក់។" },
      { id: "cp2", cat: "start", en: "Please stand up and greet the teacher.", khPhonetic: "ភ្លីស ស្ទែន អាប់ អែន គ្រីត ដឹ ធីឆឺរ។", kh: "សូមក្រោកឈរឡើង ហើយជម្រាបសួរគ្រូ។", tip: "ប្រើសម្រាប់ប្រធានថ្នាក់ ឬគ្រូបញ្ជាសិស្សមុនចាប់ផ្តើមមេរៀន។" },
      { id: "cp3", cat: "start", en: "Please sit down and open your textbook to page ten.", khPhonetic: "ភ្លីស ស៊ីត ដោន អែន អូផឹន យួរ ថិចប៊ុក ធូ ផេក ថិន។", kh: "សូមអង្គុយចុះ ហើយបើកសៀវភៅពុម្ពរបស់ប្អូនទៅទំព័រទី ១០។", tip: "អាចប្តូរលេខទំព័រ (page ten) តាមមេរៀនជាក់ស្តែង។" },
      { id: "cp4", cat: "start", en: "Let's check the attendance first. Who is absent today?", khPhonetic: "ឡិតស៍ ឆិក ដឹ អឺថេនដិនស៍ ហ្វឺស។ ហ៊ូ អ៊ីស អែបសិន ធូដេ?", kh: "តោះយើងស្រង់វត្តមានសិន។ តើថ្ងៃនេះនរណាអវត្តមាន?", tip: "ប្រើមុនពេលស្រង់វត្តមានក្នុងប្រព័ន្ធ PLP ជារៀងរាល់ថ្ងៃ។" },
      { id: "cp5", cat: "start", en: "Are you ready to start our new lesson?", khPhonetic: "អា យូ រ៉េឌី ធូ ស្តាត អាវអឺ ញូ ឡេសសិន?", kh: "តើប្អូនៗត្រៀមខ្លួនរួចរាល់ដើម្បីចាប់ផ្តើមមេរៀនថ្មីហើយឬនៅ?", tip: "សិស្សអាចឆ្លើយព្រមគ្នាថា៖ Yes, we are ready!" },

      // Category: Instructions & Management
      { id: "cp6", cat: "manage", en: "Please be quiet and pay attention to the board.", khPhonetic: "ភ្លីស ប៊ី ខ្វាយអិត អែន ផេ អឺថេនសិន ធូ ដឹ បត។", kh: "សូមរក្សាភាពស្ងៀមស្ងាត់ ហើយយកចិត្តទុកដាក់មើលមកក្តារខៀន។", tip: "ប្រើពេលសិស្សជជែកគ្នា ដើម្បីទាញចំណាប់អារម្មណ៍មកលើក្តារខៀន។" },
      { id: "cp7", cat: "manage", en: "Listen carefully and repeat after me, please.", khPhonetic: "លីសសិន ខែហ្វូលី អែន រីភីត អាហ្វធឺ មី ភ្លីស។", kh: "សូមស្តាប់ឱ្យបានច្បាស់ ហើយអានតាមគ្រូ។", tip: "សំខាន់បំផុតពេលបង្រៀនអំណាន ឬពាក្យថ្មីៗ។" },
      { id: "cp8", cat: "manage", en: "Raise your hand if you know the answer.", khPhonetic: "រ៉េស យួរ ហែន អ៊ីហ្វ យូ ណូ ដឹ អានសឺរ។", kh: "សូមលើកដៃឡើង ប្រសិនបើប្អូនដឹងចម្លើយ។", tip: "បណ្តុះទម្លាប់សិស្សឱ្យលើកដៃមុនឆ្លើយ ជៀសវាងស្រែកឆ្លើយឡូឡា។" },
      { id: "cp9", cat: "manage", en: "Work in pairs and discuss this question for two minutes.", khPhonetic: "វើក អ៊ីន ផែស៍ អែន ឌីស្កាស ឌីស ខ្វេសឆិន ហ្វរ ធូ មីនីតស៍។", kh: "ចាប់ដៃគូពីរៗនាក់ ហើយពិភាក្សាសំណួរនេះរយៈពេល ២ នាទី។", tip: "ប្រើសម្រាប់សកម្មភាពពិភាក្សាជាដៃគូ (Think-Pair-Share)។" },

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
          const today = new Date().toISOString().slice(0, 10);
          if (state.lastStudyDate !== today) {
            state.streak = (state.streak || 1) + 1;
            state.lastStudyDate = today;
            state.completedHabits = [];
            saveState();
          }
        }
      } catch (e) {}
      updateHeaderUI();
      renderWod();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          xp: state.xp,
          streak: state.streak,
          lastStudyDate: state.lastStudyDate,
          masteredIds: state.masteredIds,
          completedHabits: state.completedHabits,
          wodIndex: state.wodIndex
        }));
      } catch (e) {}
      updateHeaderUI();
    }

    function addXP(amount, reason) {
      state.xp = (state.xp || 0) + amount;
      saveState();
      if (reason) showToast(`+${amount} XP • ${reason}`);
    }

    function toggleMastered(id) {
      const idx = state.masteredIds.indexOf(id);
      if (idx === -1) {
        state.masteredIds.push(id);
        addXP(20, "បានចងចាំពាក្យ/ឃ្លាថ្មី!");
        if (state.masteredIds.length >= 5 && !state.completedHabits.includes("h2")) {
          state.completedHabits.push("h2");
        }
      } else {
        state.masteredIds.splice(idx, 1);
      }
      saveState();
      renderActiveTab();
    }

    function updateHeaderUI() {
      document.getElementById("xpCount").textContent = state.xp || 0;
      document.getElementById("streakCount").textContent = state.streak || 1;
      document.getElementById("masteredCount").textContent = (state.masteredIds || []).length;

      const xp = state.xp || 0;
      let levelText = "Level A1 • Beginner";
      if (xp >= 1000) levelText = "Level C1 • Advanced Master";
      else if (xp >= 600) levelText = "Level B2 • Upper-Intermediate";
      else if (xp >= 300) levelText = "Level B1 • Intermediate";
      else if (xp >= 100) levelText = "Level A2 • Elementary";
      document.getElementById("cefrBadge").textContent = levelText;
    }

      txt.textContent = msg;
      box.classList.remove("hidden");
      box.classList.add("flex");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        box.classList.add("hidden");
        box.classList.remove("flex");
      }, 2600);
    }

    // ==========================================
    // 3. SPEECH SYNTHESIS (NORMAL & SLOW AUDIO)
    // ==========================================
    function speakEnglish(text, rate = 0.95, onEndCallback = null) {
      if (!text) return;
      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = "en-US";
          utter.rate = rate;
          utter.pitch = 1.0;
          const voices = window.speechSynthesis.getVoices() || [];
          const preferred = voices.find(v => v.lang && v.lang.startsWith("en") && (v.name.includes("Google") || v.name.includes("Natural") || v.name.includes("Samantha") || v.name.includes("Daniel"))) || voices.find(v => v.lang && v.lang.startsWith("en"));
          if (preferred) utter.voice = preferred;
          if (onEndCallback) utter.onend = onEndCallback;
          window.speechSynthesis.speak(utter);
          return;
        }
      } catch (e) {}
      // Fallback TTS
      try {
        const audio = new Audio("https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=" + encodeURIComponent(text));
        audio.playbackRate = rate;
        if (onEndCallback) audio.onended = onEndCallback;
        audio.play().catch(() => {});
      } catch (e) {}
    }

    function selectSpeakingDrill(idx) {
      state.speakingIndex = idx;
      state.lastTranscript = "";
      state.lastScore = null;
      renderActiveTab();
    }

    function startSpeechRecognition() {
      const drill = SPEAKING_DRILLS[state.speakingIndex];
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        // Simulated interactive practice when browser iframe blocks microphone or lacks SpeechRecognition
        simulateSpeakingEvaluation(drill.en);
        return;
      }
      try {
        const rec = new SpeechRec();
        rec.lang = "en-US";
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        state.isRecording = true;
        renderActiveTab();

        rec.onresult = (ev) => {
          state.isRecording = false;
          const spoken = ev.results[0][0].transcript || "";
          evaluateSpokenText(drill.en, spoken);
        };
        rec.onerror = () => {
          state.isRecording = false;
          simulateSpeakingEvaluation(drill.en);
        };
        rec.onend = () => {
          if (state.isRecording) {
            state.isRecording = false;
            renderActiveTab();
          }
        };
        rec.start();
      } catch (e) {
        simulateSpeakingEvaluation(drill.en);
      }
    }

    function evaluateSpokenText(target, spoken) {
      state.lastTranscript = spoken;
      const cleanTarget = target.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(Boolean);
      const cleanSpoken = spoken.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(Boolean);
      let matched = 0;
      cleanTarget.forEach(w => {
        if (cleanSpoken.includes(w)) matched++;
      });
      const score = Math.min(100, Math.max(65, Math.round((matched / cleanTarget.length) * 100)));
      state.lastScore = score;
      addXP(30, `ពិន្ទុបញ្ចេញសំឡេង ${score}%!`);
      if (!state.completedHabits.includes("h3")) {
        state.completedHabits.push("h3");
        saveState();
      }
      renderActiveTab();
    }

    function simulateSpeakingEvaluation(target) {
      speakEnglish(target, 0.9, () => {
        state.lastTranscript = target;
        state.lastScore = 96;
        addXP(30, "បានហាត់អានបញ្ចេញសំឡេងតាមគំរូ (96%)!");

    function selectDialogue(idx) {

    function playFullDialogue() {
      const dlg = DIALOGUES[state.dialogueIndex];
      if (!dlg) return;
      let i = 0;
      function nextLine() {
        if (i >= dlg.lines.length) {
          addXP(25, "បានស្តាប់ការសន្ទនាចប់ពេញលេញ!");
          return;
        }
        const line = dlg.lines[i++];
        speakEnglish(line.en, 0.92, () => {
          setTimeout(nextLine, 450);
        });
      }
      nextLine();
    }

      if (currentBuilt === gr.scramble.answer) {
        state.scrambleSolved = true;
        speakEnglish(gr.scramble.answer, 0.95);
        addXP(40, "ផ្គុំល្បះវេយ្យាករណ៍បានត្រឹមត្រូវ!");
        if (!state.completedHabits.includes("h4")) {
          state.completedHabits.push("h4");
          saveState();
        }
      }
      renderActiveTab();
    }

      state.scrambleSelected = [];
      state.scrambleSolved = false;
      renderActiveTab();
    }

            <div class="space-y-3 pt-2">
              <h3 class="text-xs sm:text-sm font-black text-sky-300">❓ សំណួរត្រិះរិះយល់ន័យ (Reading Comprehension)</h3>
              ${rd.questions.map((qItem, qIdx) => {
                const picked = state.readingAnswers[qIdx];
                return `
                  <div class="p-4 rounded-2xl bg-slate-950/70 border border-white/10 space-y-2.5">
                    <p class="text-xs sm:text-sm font-bold text-white font-en">${qIdx + 1}. ${qItem.q}</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      ${qItem.options.map((opt, oIdx) => {
                        let cls = "bg-slate-800/90 hover:bg-slate-700 text-slate-200 border-white/10";
                        if (picked !== undefined) {
                          if (oIdx === qItem.correct) cls = "bg-emerald-500 text-slate-950 font-black border-emerald-300";
                          else if (picked === oIdx) cls = "bg-rose-500 text-white border-rose-300";
                        }
                        return `
                          <button onclick="answerReadingQ(${qIdx}, ${oIdx})" class="p-2.5 rounded-xl border text-left text-xs font-en font-semibold transition cursor-pointer ${cls}">
                            ${opt}
                          </button>
                        `;
                      }).join("")}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    }

    // ------------------------------------------
    // MODULE 7: DAILY STUDY PLAN & MASTERY QUIZ
    // ------------------------------------------
    function toggleHabit(id, xp) {
      const idx = state.completedHabits.indexOf(id);
      if (idx === -1) {
        state.completedHabits.push(id);
        addXP(xp, "បានបំពេញផែនការហ្វឹកហាត់ប្រចាំថ្ងៃ!");
      } else {
        state.completedHabits.splice(idx, 1);
        saveState();
      }
      renderActiveTab();
    }
    function selectQuizOption(qIdx, optIdx) {
      if (state.quizSubmitted) return;
      state.quizAnswers[qIdx] = optIdx;
      renderActiveTab();
    }
    function submitMasteryQuiz() {
      state.quizSubmitted = true;
      let correctCount = 0;
      MASTERY_QUIZ.forEach((q, i) => {
        if (state.quizAnswers[i] === q.correct) correctCount++;
      });
      addXP(correctCount * 20, `បានបញ្ចប់តេស្តវាស់ស្ទង់ (${correctCount}/${MASTERY_QUIZ.length})!`);
      if (!state.completedHabits.includes("h5")) {
        state.completedHabits.push("h5");
        saveState();
      }
      renderActiveTab();
    }
    function resetMasteryQuiz() {
      state.quizAnswers = {};
      state.quizSubmitted = false;
      renderActiveTab();
    }

    function renderQuizModule() {
      let correctCount = 0;
      MASTERY_QUIZ.forEach((q, i) => {
        if (state.quizAnswers[i] === q.correct) correctCount++;
      });

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- Left Column: Daily 15-Minute Self-Development Plan -->
          <div class="lg:col-span-5 space-y-4">
            <div class="bg-slate-900/90 border border-amber-400/40 rounded-3xl p-5 space-y-4 shadow-xl">
              <div class="flex items-center justify-between">
                <h2 class="font-moul text-sm sm:text-base text-amber-300">📅 ផែនការអភិវឌ្ឍន៍ខ្លួនឯង ១៥ នាទីប្រចាំថ្ងៃ</h2>
                <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold">${state.completedHabits.length}/${DAILY_HABITS.length} សម្រេច</span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed">ធីកលើសកម្មភាពដែលអ្នកបានអនុវត្តក្នុងថ្ងៃនេះ ដើម្បីរក្សា Streak និងសន្សំ XP ឡើងកម្រិត CEFR៖</p>

              <div class="space-y-2.5">
                ${DAILY_HABITS.map(h => {
                  const done = state.completedHabits.includes(h.id);
                  return `
                    <div onclick="toggleHabit('${h.id}', ${h.xp})" class="p-3.5 rounded-2xl border transition cursor-pointer flex items-center justify-between gap-3 ${done ? 'bg-emerald-950/40 border-emerald-400/60 text-white' : 'bg-slate-950/70 border-white/10 text-slate-300 hover:border-amber-400/40'}">
                      <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs shrink-0 ${done ? 'bg-emerald-500 border-emerald-400 text-slate-950 font-black' : 'border-amber-400/60'}">
                          ${done ? '✓' : ''}
                        </div>
                        <span class="text-xs font-bold leading-snug ${done ? 'line-through text-emerald-200' : ''}">${h.icon} ${h.title}</span>
                      </div>
                      <span class="px-2 py-0.5 rounded-lg bg-amber-400/15 text-amber-300 font-black text-[10px] shrink-0">+${h.xp} XP</span>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          </div>

          <!-- Right Column: 12-Question Mastery Assessment -->
          <div class="lg:col-span-7 space-y-4">
            <div class="bg-slate-900/90 border border-white/10 rounded-3xl p-5 sm:p-6 space-y-4 shadow-xl">
              <div class="flex items-center justify-between flex-wrap gap-2 border-b border-white/10 pb-3">
                <div>
                  <h2 class="font-moul text-sm sm:text-base text-sky-300">🏆 តេស្តវាស់ស្ទង់សមត្ថភាពភាសាអង់គ្លេស (១២ សំណួរ)</h2>
                  <p class="text-xs text-slate-400 mt-0.5">ពិនិត្យចំណេះដឹងលើឃ្លាក្នុងថ្នាក់ វាក្យសព្ទ និងវេយ្យាករណ៍អង់គ្លេស</p>
                </div>
                ${state.quizSubmitted ? `
                  <div class="px-4 py-1.5 rounded-2xl bg-emerald-500 text-slate-950 font-black text-xs sm:text-sm">
                    ពិន្ទុ៖ ${correctCount} / ${MASTERY_QUIZ.length} (${Math.round((correctCount / MASTERY_QUIZ.length) * 100)}%)
                  </div>
                ` : ''}
              </div>

              <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                ${MASTERY_QUIZ.map((item, qIdx) => {
                  const picked = state.quizAnswers[qIdx];
                  return `
                    <div class="p-4 rounded-2xl bg-slate-950/80 border border-white/10 space-y-2.5">
                      <p class="text-xs sm:text-sm font-bold text-white font-en">${item.q}</p>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${item.options.map((opt, oIdx) => {
                          let cls = "bg-slate-800 hover:bg-slate-700 text-slate-200 border-white/10";
                          if (!state.quizSubmitted && picked === oIdx) {
                            cls = "bg-amber-400 text-slate-950 font-black border-amber-300";
                          } else if (state.quizSubmitted) {
                            if (oIdx === item.correct) cls = "bg-emerald-500 text-slate-950 font-black border-emerald-300";
                            else if (picked === oIdx) cls = "bg-rose-500 text-white border-rose-300";
                          }
                          return `
                            <button onclick="selectQuizOption(${qIdx}, ${oIdx})" class="p-2.5 rounded-xl border text-left text-xs font-en font-semibold transition cursor-pointer ${cls}">
                              ${opt}
                            </button>
                          `;
                        }).join("")}
                      </div>
                      ${state.quizSubmitted ? `
                        <div class="p-2.5 rounded-xl bg-amber-400/10 border border-amber-400/30 text-[11px] text-amber-200">
                          💡 <strong>ការពន្យល់៖</strong> ${item.exp}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join("")}
              </div>

              <div class="pt-3 border-t border-white/10 flex items-center justify-end gap-3">
                ${state.quizSubmitted ? `
                  <button onclick="resetMasteryQuiz()" class="px-5 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs sm:text-sm cursor-pointer">
                    🔄 ធ្វើតេស្តម្តងទៀត
                  </button>
                ` : `
                  <button onclick="submitMasteryQuiz()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-xs sm:text-sm shadow-lg cursor-pointer">
                    ✅ បញ្ជូនចម្លើយ & មើលពិន្ទុ
                  </button>
                `}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function closeStudio() {
      try {
        if (window.parent && window.parent !== window && window.parent.closeEnglishSelfDevModal) {
          window.parent.closeEnglishSelfDevModal();
          return;
        }
      } catch (e) {}
      window.history.length > 1 ? window.history.back() : (window.location.href = "/");
    }

    // Initialize on load
    window.addEventListener("DOMContentLoaded", () => {
      loadState();
      renderActiveTab();
    });
  </script>
</body>
</html>
