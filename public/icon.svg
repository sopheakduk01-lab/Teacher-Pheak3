<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Digital Cyber Blue to Indigo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Digital Cyan Neon Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Cyber Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Holographic Violet-Purple Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon with Rounded Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>

  <!-- High-Tech Neon Border -->
  <rect x="18" y="18" width="476" height="476" rx="100" fill="none" stroke="url(#cyanNeon)" stroke-width="4" opacity="0.75"/>
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Digital Tech Circuit Lines in Background -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Left Circuits -->
    <path d="M 60 140 L 140 140 L 180 100 L 256 100" />
    <circle cx="60" cy="140" r="4" fill="#38bdf8" />
    <circle cx="180" cy="100" r="4" fill="#38bdf8" />

    <!-- Top Right Circuits -->
    <path d="M 452 140 L 372 140 L 332 100 L 256 100" />
    <circle cx="452" cy="140" r="4" fill="#38bdf8" />
    <circle cx="332" cy="100" r="4" fill="#38bdf8" />

    <!-- Bottom Left Circuits -->
    <path d="M 60 372 L 140 372 L 190 422 L 256 422" />
    <circle cx="60" cy="372" r="4" fill="#22d3ee" />
    <circle cx="190" cy="422" r="4" fill="#22d3ee" />

    <!-- Bottom Right Circuits -->
    <path d="M 452 372 L 372 372 L 322 422 L 256 422" />
    <circle cx="452" cy="372" r="4" fill="#22d3ee" />
    <circle cx="322" cy="422" r="4" fill="#22d3ee" />

    <!-- Micro Nodes / Data Bits -->
    <circle cx="110" cy="220" r="3" fill="#818cf8" />
    <circle cx="402" cy="220" r="3" fill="#818cf8" />
    <circle cx="120" cy="300" r="3" fill="#818cf8" />
    <circle cx="392" cy="300" r="3" fill="#818cf8" />
  </g>

  <!-- Digital Microchip Core Hexagon -->
  <polygon points="256,120 370,186 370,326 256,392 142,326 142,186" fill="rgba(15, 23, 42, 0.75)" stroke="url(#cyanNeon)" stroke-width="3.5" filter="url(#glowFilter)" />

  <!-- Holographic Open Book (Education Core) -->
  <g transform="translate(136, 175)">
    <!-- Left Hologram Page -->
    <path d="M 120 70 C 80 40 40 55 0 75 L 0 175 C 40 155 80 140 120 170 Z" fill="url(#cyanNeon)" opacity="0.9"/>
    <!-- Right Hologram Page -->
    <path d="M 120 70 C 160 40 200 55 240 75 L 240 175 C 200 155 160 140 120 170 Z" fill="url(#violetGrad)" opacity="0.9"/>
    <!-- Center Spine Light Beam -->
    <line x1="120" y1="65" x2="120" y2="175" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Digital Data Lines on Pages -->
    <path d="M 25 100 Q 60 90 95 105" stroke="#ffffff" stroke-width="2.5" opacity="0.7" fill="none"/>
    <path d="M 25 120 Q 60 110 95 125" stroke="#ffffff" stroke-width="2.5" opacity="0.7" fill="none"/>
    <path d="M 25 140 Q 60 130 95 145" stroke="#ffffff" stroke-width="2.5" opacity="0.7" fill="none"/>

    <path d="M 145 105 Q 180 90 215 100" stroke="#ffffff" stroke-width="2.5" opacity="0.7" fill="none"/>
    <path d="M 145 125 Q 180 110 215 120" stroke="#ffffff" stroke-width="2.5" opacity="0.7" fill="none"/>
    <path d="M 145 145 Q 180 130 215 140" stroke="#ffffff" stroke-width="2.5" opacity="0.7" fill="none"/>
  </g>

  <!-- Futuristic Smart Graduation Mortarboard with Golden Accents -->
  <g transform="translate(256, 178)">
    <!-- Glow behind cap -->
    <circle cx="0" cy="-5" r="55" fill="url(#cyanNeon)" opacity="0.25" filter="url(#glowFilter)"/>

    <!-- Diamond Mortarboard Top -->
    <polygon points="0,-48 105,-8 0,32 -105,-8" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5"/>
    <polygon points="0,-42 90,-8 0,26 -90,-8" fill="url(#cyanNeon)" opacity="0.2"/>

    <!-- Cyber Cap Base Structure -->
    <path d="M -58 14 L -58 50 C -58 68 58 68 58 50 L 58 14 Z" fill="#090d1f" stroke="url(#cyanNeon)" stroke-width="3"/>

    <!-- Smart Golden Tassel with Glowing Cyber Orb -->
    <path d="M 65 2 Q 95 24 82 66" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="82" cy="72" r="9" fill="url(#goldGrad)" filter="url(#glowFilter)"/>
    <circle cx="82" cy="72" r="4" fill="#ffffff"/>

    <!-- Top Cap Cyber Center Node -->
    <circle cx="0" cy="-8" r="7" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-8" r="3" fill="#ffffff"/>
  </g>

  <!-- Digital Spark / AI Intelligence Stars -->
  <g transform="translate(256, 88)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#goldGrad)" filter="url(#glowFilter)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
  <g transform="translate(130, 140) scale(0.6)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#22d3ee" filter="url(#glowFilter)" />
  </g>
  <g transform="translate(382, 140) scale(0.6)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#22d3ee" filter="url(#glowFilter)" />
  </g>
</svg>
