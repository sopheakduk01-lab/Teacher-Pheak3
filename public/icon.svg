<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Blue & White Gingham Checkered Background Pattern -->
    <pattern id="gingham" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#ffffff" />
      <rect x="0" y="0" width="24" height="48" fill="#608be8" fill-opacity="0.55" />
      <rect x="0" y="0" width="48" height="24" fill="#608be8" fill-opacity="0.55" />
      <rect x="0" y="0" width="24" height="24" fill="#2b5ce0" />
    </pattern>
  </defs>

  <!-- Gingham Background -->
  <rect width="512" height="512" fill="url(#gingham)" />

  <!-- Centered Pure White Circle -->
  <circle cx="256" cy="256" r="200" fill="#ffffff" />

  <!-- Royal Blue Speech Bubble with Bottom-Left Tail -->
  <path
    d="M 146 138
       H 366
       A 54 54 0 0 1 420 192
       V 300
       A 54 54 0 0 1 366 354
       H 214
       L 152 406
       V 354
       H 146
       A 54 54 0 0 1 92 300
       V 192
       A 54 54 0 0 1 146 138 Z"
    fill="#1049cf"
  />

  <!-- Khmer Label: ថ្នាក់ទី៦ -->
  <text
    x="256"
    y="268"
    text-anchor="middle"
    font-family="'Kantumruy Pro', 'Noto Sans Khmer', 'Battambang', sans-serif"
    font-size="78"
    font-weight="800"
    letter-spacing="1"
  >
    <tspan fill="#fbbf24">ថ្នាក់</tspan><tspan fill="#ffffff">ទី</tspan><tspan fill="#fbbf24">៦</tspan>
  </text>
</svg>
